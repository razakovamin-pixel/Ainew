<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080909">
<meta name="description" content="Библиотека фикха — Масабих аз-Залям фи шарх Мафатих аш-Шараи‘ и другие шиитские источники">
<title>Библиотека фикха | ShiaIsnad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Те же тёмные красно-чёрные токены, что и на главной странице (SHIAWAY VISUAL OVERRIDES) —
     чтобы страница визуально была частью того же сайта. */
  --ink: #080909;
  --ink-1: #0d0f0f;
  --ink-2: #111313;
  --ink-3: #151717;
  --teal: #e21b30;
  --teal-glow: rgba(226,27,48,.16);
  --teal-light: #ff3948;
  --amber: #ff6b76;
  --amber-glow: rgba(255,107,118,.16);
  --rose: #ff3948;
  --gold: #e21b30;
  --gold-glow: rgba(226,27,48,.18);
  --text: #f4f2ef;
  --text-2: #b7b7bc;
  --text-3: #777;
  --border: #242626;
  --border-bright: rgba(255,255,255,.10);
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 20px 60px rgba(0,0,0,.36);
  --shadow-sm: 0 6px 18px rgba(0,0,0,.22);
  --font-display: 'Inter', Arial, sans-serif;
  --font-serif-body: 'Inter', Arial, sans-serif;
  --font-body: 'Inter', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --header-h: 60px;
  --tabbar-h: 82px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;font-size:16px;scroll-behavior:smooth;overscroll-behavior:none;overflow-x:hidden;}
body{
  font-family:var(--font-body);
  background:var(--ink);
  color:var(--text);
  min-height:100%;
  position:relative;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(30deg,#fff 1px,transparent 1px),
    linear-gradient(150deg,#fff 1px,transparent 1px);
  background-size:90px 52px;
  mask-image:linear-gradient(90deg,black,transparent 65%);
  opacity:.035;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(226,27,48,.14), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 110%, rgba(255,57,72,.08), transparent 55%);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* HEADER */
.hd-header{
  position:sticky;top:0;z-index:20;height:var(--header-h);
  display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg, var(--ink-1), var(--ink));
  border-bottom:1px solid var(--border-bright);
  box-shadow:var(--shadow-sm);
}
.hd-back{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink-2);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);flex-shrink:0;
}
.hd-titles{flex:1;min-width:0;}
.hd-title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-sub{font-size:11px;color:var(--text-3);letter-spacing:.03em;}
.hd-search-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);
}

.frag-text.hd-loading{color:var(--text-3);font-style:italic;font-family:var(--font-body);font-size:14px;}

/* SEARCH BAR */
.search-bar{
  position:sticky;top:var(--header-h);z-index:19;
  background:var(--ink);border-bottom:1px solid var(--border);
  padding:10px 14px;display:none;gap:8px;
}
.search-bar.open{display:flex;}
.search-bar input{
  flex:1;background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 12px;font-size:14px;color:var(--text);font-family:var(--font-body);
}
.search-bar input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}

/* BREADCRUMB */
.crumb{
  padding:10px 14px 4px;font-size:12px;color:var(--text-3);display:flex;
  align-items:center;gap:6px;flex-wrap:wrap;
}
.crumb span.seg{cursor:pointer;color:var(--teal);}
.crumb span.seg:hover{text-decoration:underline;}
.crumb span.sep{color:var(--text-3);}
.crumb span.cur{color:var(--text-2);font-weight:600;}

/* MAIN */
main{position:relative;z-index:1;padding:10px 14px calc(var(--tabbar-h) + 24px);max-width:840px;margin:0 auto;}

/* BOOK LIST */
.book-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;transition:transform .15s, box-shadow .15s;
}
.book-card:active{transform:scale(.985);}
.book-num{
  font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--gold);
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border-bright);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ink-1);
}
.book-info{flex:1;min-width:0;}
.book-title{font-family:var(--font-serif-body);font-size:16.5px;font-weight:600;line-height:1.3;color:var(--text);}
.book-meta{font-size:11.5px;color:var(--text-3);margin-top:3px;font-family:var(--font-mono);}
.book-chev{color:var(--text-3);flex-shrink:0;}

/* CHAPTER LIST */
.chapter-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
}
.chapter-card:active{transform:scale(.985);}
.chapter-num{
  font-family:var(--font-mono);font-size:12px;color:var(--text-3);
  width:28px;height:28px;border-radius:6px;background:var(--ink-1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.chapter-info{flex:1;min-width:0;}
.chapter-title{font-family:var(--font-serif-body);font-size:15.5px;font-weight:600;line-height:1.3;}
.chapter-meta{font-size:11px;color:var(--text-3);margin-top:2px;}

/* FRAGMENT (paragraph) CARD */
.hadith-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);position:relative;
}
.hadith-card::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg, var(--gold), var(--amber));border-radius:2px;
}
.hadith-num{
  font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.05em;
  font-weight:600;margin-bottom:6px;display:block;
}
.hadith-text{
  font-family:var(--font-serif-body);font-size:16.5px;line-height:1.65;color:var(--text);
}

/* EMPTY / LOADING */
.state-msg{
  text-align:center;padding:60px 20px;color:var(--text-3);font-family:var(--font-serif-body);font-size:15px;
}
.spinner{
  width:28px;height:28px;border-radius:50%;border:3px solid var(--border);
  border-top-color:var(--gold);animation:spin 0.8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* SEARCH RESULTS */
.result-highlight{background:var(--gold-glow);color:var(--text);border-radius:2px;padding:0 1px;}
.result-path{font-size:11px;color:var(--text-3);margin-bottom:4px;font-family:var(--font-mono);}

/* BOTTOM NAV (matches main site tab bar) */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;height:var(--tabbar-h);
  background:linear-gradient(180deg, var(--ink-1), var(--ink));
  border-top:1px solid var(--border-bright);box-shadow:0 -6px 20px rgba(58,40,16,.14);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab-bar-inner{display:flex;height:100%;max-width:840px;margin:0 auto;}
.tab-btn{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-3);font-size:11px;font-family:var(--font-body);
}
.tab-btn.active{color:var(--gold);}
.tab-btn svg{width:26px;height:26px;stroke-width:1.8;transition:transform .2s;}
.tab-btn.active svg{transform:scale(1.1);filter:drop-shadow(0 0 5px rgba(226,27,48,.16));}

/* SCROLL TOP FAB */
.fab-top{
  position:fixed;right:16px;bottom:calc(var(--tabbar-h) + 16px);z-index:25;
  width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;border:none;
  box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;
}
.fab-top.show{display:flex;}

/* ── ИИ-ЧАТ ПО БИБЛИОТЕКЕ ФИКХА (локальная книга + веб-поиск DuckDuckGo) ── */
.chat-wrap{display:flex;flex-direction:column;min-height:calc(100vh - var(--header-h) - var(--tabbar-h) - 40px);}
.chat-msgs{flex:1;padding:12px 2px 10px;display:flex;flex-direction:column;gap:10px;}
.chat-bubble{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm);}
.chat-bubble.user{align-self:flex-end;background:var(--teal);color:#fdf6e3;border-bottom-right-radius:4px;}
.chat-bubble.ai{align-self:flex-start;background:var(--ink-2);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px;}
.chat-bubble.ai.thinking{color:var(--text-3);font-style:italic;box-shadow:none;}
.chat-bubble.ai.err{color:var(--rose);border-color:var(--rose);}
.chat-hint{font-size:11.5px;color:var(--text-3);text-align:center;padding:4px 20px 8px;}
.chat-input-bar{position:fixed;left:0;right:0;bottom:var(--tabbar-h);display:none;align-items:flex-end;gap:8px;padding:9px 12px;background:var(--ink);border-top:1px solid var(--border);z-index:18;}
.chat-input-bar.open{display:flex;}
.chat-input-bar textarea{flex:1;resize:none;max-height:110px;border-radius:12px;border:1px solid var(--border-bright);background:var(--ink-2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px;line-height:1.4;}
.chat-input-bar textarea:focus{outline:none;border-color:var(--teal-light);}
.chat-send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--teal);color:#fdf6e3;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send-btn:disabled{opacity:.45;}
</style>
</head>
<body>

<header class="hd-header">
  <button class="hd-back" id="backBtn" title="Назад" aria-label="Назад">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="hd-titles">
    <div class="hd-title" id="hdTitle">Библиотека фикха</div>
    <div class="hd-sub" id="hdSub">Загрузка…</div>
  </div>
  <button class="hd-search-btn" id="searchToggle" title="Поиск" aria-label="Поиск">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
</header>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" placeholder="Поиск по книге фикха…" autocomplete="off">
</div>

<div class="crumb" id="crumb"></div>

<main id="mainArea">
  <div class="state-msg"><div class="spinner"></div>Загрузка книги…</div>
</main>

<button class="fab-top" id="fabTop" title="Наверх">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<nav class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn" id="navRijal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span>Риджаль</span>
    </button>
    <button class="tab-btn active" id="navFiqh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v18"/><path d="M3 7l9-4 9 4"/><path d="M5 7v10a2 2 0 0 0 2 2h2"/><path d="M19 7v10a2 2 0 0 1-2 2h-2"/></svg>
      <span>Фикх</span>
    </button>
    <button class="tab-btn" id="navHadis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span>Хадисы</span>
    </button>
    <button class="tab-btn" id="navChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span>ИИ-чат</span>
    </button>
  </div>
</nav>

<div class="chat-input-bar" id="chatInputBar">
  <textarea id="chatInput" rows="1" placeholder="Спросите про фикх — по этой книге и интернету…"></textarea>
  <button class="chat-send-btn" id="chatSendBtn" title="Отправить" aria-label="Отправить">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
  </button>
</div>

<script>
(function(){
  var DATA = null;

  // ── Язык (общий с главным сайтом shiaisnad.ru через localStorage) ──
  var LANG_KEY = 'rijal_lang';
  function getLang(){
    var l = null;
    try { l = localStorage.getItem(LANG_KEY); } catch(e) {}
    return l === 'az' ? 'az' : 'ru';
  }

  var state = { view: 'books', bookId: null, chapterN: null, query: '', lang: getLang() };
  var chatHistory = []; // { role: 'user'|'assistant', content: string, thinking?: bool }
  var flatFragCache = null;

  var mainArea = document.getElementById('mainArea');
  var crumbEl = document.getElementById('crumb');
  var hdTitle = document.getElementById('hdTitle');
  var hdSub = document.getElementById('hdSub');

  // dataReadyPromise разрешается, когда DATA полностью загружена (успешно
  // или нет). Чат-функции (sendChatMessage) дожидаются его перед поиском по
  // локальной книге, чтобы никогда не сообщать пользователю «ничего не
  // найдено» просто из-за того, что данные ещё не успели докачаться.
  var dataReadyPromise = fetch('/fiqh/fiqh_data.json').then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(json){
    DATA = json;
    render();
  }).catch(function(){
    // Фолбэк: пробуем относительный путь (на случай другого расположения)
    return fetch('fiqh_data.json').then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(json){
      DATA = json;
      render();
    }).catch(function(err){
      mainArea.innerHTML = '<div class="state-msg">Не удалось загрузить книгу по фикху.<br>' + (err && err.message ? err.message : '') + '</div>';
    });
  });

  function esc(s){
    return String(s || '').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function highlight(text, q){
    if (!q) return esc(text);
    var idx = text.toLowerCase().indexOf(q.toLowerCase());
    if (idx === -1) return esc(text);
    return esc(text.slice(0, idx)) + '<span class="result-highlight">' + esc(text.slice(idx, idx+q.length)) + '</span>' + esc(text.slice(idx+q.length));
  }

  function setCrumb(parts){
    crumbEl.innerHTML = parts.map(function(p, i){
      if (i === parts.length - 1) return '<span class="cur">' + esc(p.label) + '</span>';
      return '<span class="seg" data-action="' + p.action + '">' + esc(p.label) + '</span><span class="sep">›</span>';
    }).join('');
    crumbEl.querySelectorAll('.seg').forEach(function(el){
      el.addEventListener('click', function(){
        var action = el.getAttribute('data-action');
        if (action === 'books') { state.view='books'; state.bookId=null; state.chapterN=null; }
        else if (action === 'chapters') { state.view='chapters'; state.chapterN=null; }
        render();
      });
    });
  }

  function pluralize(n, one, few, many){
    var mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return one;
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return few;
    return many;
  }

  function getBook(id){
    return DATA.find(function(b){ return b.id === id; });
  }

  function renderBooks(){
    var totalBooks = DATA.length;
    var totalFrag = DATA.reduce(function(sum, b){ return sum + b.chapters.reduce(function(a,c){return a + c.h.length;}, 0); }, 0);
    hdTitle.textContent = 'Библиотека фикха';
    hdSub.textContent = totalFrag + ' ' + pluralize(totalFrag,'фрагмент','фрагмента','фрагментов') + ' · ' + totalBooks + ' ' + pluralize(totalBooks,'книга','книги','книг');
    setCrumb([{label:'Все книги'}]);
    var html = '';
    DATA.forEach(function(book){
      var hcount = book.chapters.reduce(function(a,c){return a + c.h.length;}, 0);
      html += '<div class="book-card" data-book="' + book.id + '">' +
        '<div class="book-num">' + book.id + '</div>' +
        '<div class="book-info"><div class="book-title">' + esc(book.title) + '</div>' +
        '<div class="book-meta">' + (book.author ? esc(book.author) + ' · ' : '') + book.chapters.length + ' ' + pluralize(book.chapters.length,'глава','главы','глав') + ' · ' + hcount + ' ' + pluralize(hcount,'фрагмент','фрагмента','фрагментов') + '</div></div>' +
        '<div class="book-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>' +
      '</div>';
    });
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.book-card').forEach(function(el){
      el.addEventListener('click', function(){
        state.bookId = parseInt(el.getAttribute('data-book'), 10);
        state.view = 'chapters';
        render();
      });
    });
  }

  function renderChapters(){
    var book = getBook(state.bookId);
    if (!book) { state.view = 'books'; return render(); }
    hdTitle.textContent = book.title;
    hdSub.textContent = book.author || '';
    setCrumb([{label:'Все книги', action:'books'}, {label:book.title}]);
    var html = '<div style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:4px 0 4px;line-height:1.3;">' + esc(book.title) + '</div>';
    if (book.author) html += '<div style="font-size:13px;color:var(--text-2);margin-bottom:2px;">' + esc(book.author) + '</div>';
    if (book.meta) html += '<div style="font-size:12px;color:var(--text-3);margin-bottom:14px;">' + esc(book.meta) + '</div>';
    else html += '<div style="margin-bottom:14px;"></div>';
    book.chapters.forEach(function(ch){
      var pages = (ch.pageStart && ch.pageEnd) ? (' · стр. ' + ch.pageStart + '–' + ch.pageEnd) : '';
      html += '<div class="chapter-card" data-ch="' + ch.n + '">' +
        '<div class="chapter-num">' + ch.n + '</div>' +
        '<div class="chapter-info"><div class="chapter-title">' + esc(ch.name || ('Глава ' + ch.n)) + '</div>' +
        '<div class="chapter-meta">' + ch.h.length + ' ' + pluralize(ch.h.length,'фрагмент','фрагмента','фрагментов') + pages + '</div></div>' +
      '</div>';
    });
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.chapter-card').forEach(function(el){
      el.addEventListener('click', function(){
        state.chapterN = parseInt(el.getAttribute('data-ch'), 10);
        state.view = 'reading';
        render();
      });
    });
  }

  function renderReading(){
    var book = getBook(state.bookId);
    if (!book) { state.view = 'books'; return render(); }
    var ch = book.chapters.find(function(c){ return c.n === state.chapterN; });
    if (!ch) { state.view = 'chapters'; return render(); }
    hdTitle.textContent = ch.name || ('Глава ' + ch.n);
    hdSub.textContent = book.title;
    setCrumb([{label:'Все книги', action:'books'}, {label:book.title, action:'chapters'}, {label:ch.name || ('Глава ' + ch.n)}]);
    var html = '<div style="font-family:var(--font-serif-body);font-size:16px;font-weight:600;margin:4px 0 14px;color:var(--text-2);">' + esc(ch.name || '') + '</div>';
    ch.h.forEach(function(h, i){
      html += '<div class="hadith-card"><span class="hadith-num">§ ' + (i+1) + '</span><div class="hadith-text">' + esc(h.text) + '</div></div>';
    });
    mainArea.innerHTML = html;
  }

  function renderSearch(){
    hdTitle.textContent = 'Поиск';
    hdSub.textContent = '«' + state.query + '»';
    var q = state.query.toLowerCase();
    var results = [];
    DATA.forEach(function(book){
      book.chapters.forEach(function(ch){
        ch.h.forEach(function(h){
          if (h.text.toLowerCase().indexOf(q) !== -1) {
            results.push({book: book, ch: ch, h: h});
          }
        });
      });
    });
    setCrumb([{label:'Все книги', action:'books'}, {label:'Результаты: ' + results.length}]);
    if (!results.length) {
      mainArea.innerHTML = '<div class="state-msg">Ничего не найдено по запросу «' + esc(state.query) + '»</div>';
      return;
    }
    var html = '';
    results.slice(0, 300).forEach(function(r){
      html += '<div class="hadith-card" data-book="' + r.book.id + '" data-ch="' + r.ch.n + '" style="cursor:pointer;">' +
        '<div class="result-path">' + esc(r.book.title) + ' · ' + esc(r.ch.name || ('Глава ' + r.ch.n)) + '</div>' +
        '<div class="hadith-text">' + highlight(r.h.text, state.query) + '</div>' +
      '</div>';
    });
    if (results.length > 300) {
      html += '<div class="state-msg">Показаны первые 300 из ' + results.length + ' результатов. Уточните запрос.</div>';
    }
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.hadith-card[data-book]').forEach(function(el){
      el.addEventListener('click', function(){
        state.query = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('searchBar').classList.remove('open');
        state.bookId = parseInt(el.getAttribute('data-book'), 10);
        state.chapterN = parseInt(el.getAttribute('data-ch'), 10);
        state.view = 'reading';
        render();
      });
    });
  }

  // Search bar toggle
  var searchBar = document.getElementById('searchBar');
  var searchInput = document.getElementById('searchInput');
  document.getElementById('searchToggle').addEventListener('click', function(){
    searchBar.classList.toggle('open');
    if (searchBar.classList.contains('open')) searchInput.focus();
  });
  var searchTimer;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var v = searchInput.value.trim();
    searchTimer = setTimeout(function(){
      state.query = v.length >= 2 ? v : '';
      render();
    }, 250);
  });

  // Back button
  document.getElementById('backBtn').addEventListener('click', function(){
    if (state.view === 'chat') { state.view = 'books'; return render(); }
    if (state.query) { state.query=''; searchInput.value=''; searchBar.classList.remove('open'); return render(); }
    if (state.view === 'reading') { state.view = 'chapters'; state.chapterN=null; return render(); }
    if (state.view === 'chapters') { state.view = 'books'; state.bookId=null; return render(); }
    window.location.href = '/';
  });

  // Bottom nav
  document.getElementById('navRijal').addEventListener('click', function(){ window.location.href = '/'; });
  document.getElementById('navFiqh').addEventListener('click', function(){ state.view='books'; state.bookId=null; state.chapterN=null; state.query=''; render(); });
  document.getElementById('navHadis').addEventListener('click', function(){ window.location.href = '/hadis/'; });
  document.getElementById('navChat').addEventListener('click', function(){ state.view='chat'; render(); });

  // Чат: отправка сообщения
  var chatInput = document.getElementById('chatInput');
  var chatSendBtn = document.getElementById('chatSendBtn');
  chatSendBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); }
  });
  chatInput.addEventListener('input', function(){
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
  });

  // Scroll-to-top FAB
  var fab = document.getElementById('fabTop');
  window.addEventListener('scroll', function(){
    if (window.scrollY > 400) fab.classList.add('show'); else fab.classList.remove('show');
  });
  fab.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  // ── ИИ-чат: локальная книга по фикху + веб-поиск (DuckDuckGo через /ai/chat) ──
  function getFlatFrag(){
    if (flatFragCache) return flatFragCache;
    flatFragCache = [];
    if (!DATA) return flatFragCache;
    DATA.forEach(function(book){
      (book.chapters || []).forEach(function(ch){
        (ch.h || []).forEach(function(h){
          if (!h || !h.text) return;
          flatFragCache.push({
            bookTitle: book.title || '',
            chapterN: ch.n,
            chapterName: ch.name || '',
            fragId: h.id,
            text: h.text,
          });
        });
      });
    });
    return flatFragCache;
  }

  function findLocalFrag(query, limit){
    var flat = getFlatFrag();
    var words = String(query || '').toLowerCase().split(/[^a-zа-яёàâ0-9]+/i).filter(function(w){ return w.length >= 3; });
    if (!flat.length || !words.length) return [];
    var scored = [];
    flat.forEach(function(item){
      var hay = (item.text + ' ' + item.bookTitle + ' ' + item.chapterName).toLowerCase();
      var score = 0;
      words.forEach(function(w){ if (hay.indexOf(w) !== -1) score++; });
      if (score > 0) scored.push({ item: item, score: score });
    });
    scored.sort(function(a, b){ return b.score - a.score; });
    return scored.slice(0, limit || 6).map(function(s){ return s.item; });
  }

  function buildFiqhSystemPrompt(matches){
    var flat = getFlatFrag();
    var books = [];
    (DATA || []).forEach(function(b){ if (b.title) books.push(b.title); });
    var matchesBlock;
    if (matches.length) {
      matchesBlock = '=== НАЙДЕНО В ЛОКАЛЬНОЙ КНИГЕ (' + matches.length + ') ===\n' +
        matches.map(function(h){
          var loc = (h.bookTitle || '') + ', ' + (h.chapterName || ('глава ' + h.chapterN)) + ', §' + h.fragId;
          var text = h.text.length > 900 ? h.text.slice(0, 900) + '…' : h.text;
          return '• ' + loc + ':\n  ' + text;
        }).join('\n\n');
    } else {
      matchesBlock = '=== НАЙДЕНО В ЛОКАЛЬНОЙ КНИГЕ ===\nНичего не найдено по этому запросу в fiqh_data.json.';
    }

    return (
      'Ты — ИИ-ассистент раздела «Библиотека фикха» проекта ShiaIsnad (страница /fiqh), ' +
      'помогаешь по вопросам шиитского фикха (исламского права). У тебя есть два источника:\n' +
      '1) локальная книга «' + (books.join(', ') || '—') + '» (' + flat.length + ' фрагментов) — фрагменты, ' +
      'найденные по запросу пользователя, приведены ниже в блоке «НАЙДЕНО В ЛОКАЛЬНОЙ КНИГЕ»;\n' +
      '2) результаты веб-поиска (DuckDuckGo) по надёжным исламским источникам, которые сервер ' +
      'автоматически подмешивает в этот системный промпт при необходимости.\n\n' +
      'ПРАВИЛА:\n' +
      '✓ Если в блоке «НАЙДЕНО В ЛОКАЛЬНОЙ КНИГЕ» есть релевантный фрагмент — используй его как ' +
      'основной источник и ссылайся на него в формате «глава, §N».\n' +
      '✓ Если локальных фрагментов недостаточно или их нет — используй результаты веб-поиска ' +
      '(если они переданы ниже) или свои общие знания по фикху, но чётко давай понять, когда ответ ' +
      'опирается не на эту книгу, а на другие источники/общие знания.\n' +
      '✗ Не выдумывай цитаты, номера параграфов или ссылки на главы, которых нет в блоке ниже.\n' +
      '✓ Пиши на языке вопроса пользователя. Отвечай по существу (обычно 3–10 предложений), ' +
      'подробнее — только если прямо просят.\n' +
      '✓ Вопросы не по фикху (например, оценка передатчиков хадисов/риджаль) коротко и дружелюбно ' +
      'переадресуй в соответствующий раздел сайта shiaisnad.ru.\n\n' +
      matchesBlock
    );
  }

  function scrollChatToBottom(){
    var el = document.getElementById('chatMsgs');
    if (el) el.scrollTop = el.scrollHeight;
  }

  function renderChatMessages(){
    var el = document.getElementById('chatMsgs');
    if (!el) return;
    if (!chatHistory.length) {
      el.innerHTML = '<div class="chat-bubble ai">Спрашивайте о фикхе — отвечаю по этой книге, а также ищу дополнительный контекст в интернете (DuckDuckGo), если это нужно.</div>';
      return;
    }
    el.innerHTML = chatHistory.map(function(m){
      var cls = 'chat-bubble ' + (m.role === 'user' ? 'user' : 'ai') + (m.thinking ? ' thinking' : '') + (m.err ? ' err' : '');
      return '<div class="' + cls + '">' + esc(m.content) + '</div>';
    }).join('');
    scrollChatToBottom();
  }

  function renderChat(){
    hdTitle.textContent = 'ИИ-чат по фикху';
    hdSub.textContent = 'Книга + веб-поиск (' + getFlatFrag().length + ' фрагментов)';
    setCrumb([{ label: 'Фикх', action: 'books' }, { label: 'ИИ-чат' }]);
    mainArea.innerHTML =
      '<div class="chat-wrap"><div class="chat-msgs" id="chatMsgs"></div>' +
      '<div class="chat-hint">Отвечает по книге фикха и, при необходимости, ищет дополнительный контекст в интернете через DuckDuckGo.</div></div>';
    renderChatMessages();
  }

  async function sendChatMessage(){
    var input = document.getElementById('chatInput');
    var sendBtn = document.getElementById('chatSendBtn');
    var text = (input.value || '').trim();
    if (!text) return;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    chatHistory.push({ role: 'user', content: text });
    var thinkingIdx = chatHistory.length;
    chatHistory.push({ role: 'assistant', content: 'Ищу в книге и в интернете…', thinking: true });
    renderChatMessages();

    // Дожидаемся полной загрузки книги, если пользователь успел написать
    // сообщение раньше, чем она докачалась.
    try { await dataReadyPromise; } catch (e) {}

    var matches = findLocalFrag(text, 6);
    var systemText = buildFiqhSystemPrompt(matches);
    var apiMessages = chatHistory
      .filter(function(m){ return !m.thinking; })
      .slice(-12)
      .map(function(m){ return { role: m.role, content: m.content }; });

    try {
      // Без заголовка X-Hadith-Strict: сервер (/ai/chat в worker.js) сам
      // подмешает контекст из веб-поиска DuckDuckGo по надёжным исламским
      // сайтам (см. collectSourceContext в worker.js), если это уместно
      // по последнему вопросу пользователя.
      var res = await fetch('/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-Fiqh-Chat': '1' },
        body: JSON.stringify({ max_tokens: 900, temperature: 0.3, system: systemText, messages: apiMessages }),
      });
      var data = await res.json().catch(function(){ return {}; });
      var reply =
        (data && data.content && data.content[0] && data.content[0].text) ||
        (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) ||
        '';
      reply = String(reply || '').trim();
      if (!res.ok || !reply) {
        chatHistory[thinkingIdx] = { role: 'assistant', content: (data && data.error) || 'Не удалось получить ответ. Попробуйте ещё раз.', err: true };
      } else {
        chatHistory[thinkingIdx] = { role: 'assistant', content: reply };
      }
    } catch (e) {
      chatHistory[thinkingIdx] = { role: 'assistant', content: 'Ошибка сети. Попробуйте ещё раз.', err: true };
    }

    sendBtn.disabled = false;
    renderChatMessages();
  }

  function render(){
    if (!DATA) return;
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});

    var chatBar = document.getElementById('chatInputBar');
    var searchBtn = document.getElementById('searchToggle');
    var isChat = state.view === 'chat';
    if (chatBar) chatBar.classList.toggle('open', isChat);
    if (searchBtn) searchBtn.style.display = isChat ? 'none' : '';
    document.getElementById('navFiqh').classList.toggle('active', !isChat);
    document.getElementById('navChat').classList.toggle('active', isChat);

    if (isChat) return renderChat();
    if (state.query) return renderSearch();
    if (state.view === 'books') return renderBooks();
    if (state.view === 'chapters') return renderChapters();
    if (state.view === 'reading') return renderReading();
  }
})();
</script>
