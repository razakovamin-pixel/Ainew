<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Панель управления — Ilm al-Rijal</title>
<meta name="robots" content="noindex, nofollow" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/3.4.4/tailwind.min.js" onerror="this.onerror=null;document.write('<script src=\'https://cdn.tailwindcss.com\'>\x3c/script>')"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: { 950: '#0a0708', 900: '#120c0d', 850: '#181012', 800: '#1f1518', 700: '#2b1c1f' },
          blood: { 500: '#e11d2a', 600: '#c8121f', 700: '#a30f19', 400: '#f0454f' },
        },
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
      },
    },
  };
</script>
<style>
  html, body { background:#0a0708; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #3a2226; border-radius: 8px; }
  ::-webkit-scrollbar-track { background: #120c0d; }
  .fade-in { animation: fadeIn .25s ease-out; }
  @keyframes fadeIn { from { opacity:0; transform: translateY(4px);} to {opacity:1; transform:none;} }
  .nav-link.active { background: linear-gradient(90deg, rgba(225,29,42,.18), transparent); border-left-color:#e11d2a; color:#fff; }
  .nav-link { border-left: 3px solid transparent; }
  input, textarea, select { color-scheme: dark; }
  .skeleton { background: linear-gradient(90deg,#1f1518 25%,#2b1c1f 37%,#1f1518 63%); background-size:400% 100%; animation: sk 1.4s ease infinite; }
  @keyframes sk { 0%{background-position:100% 50%} 100%{background-position:0 50%} }
</style>
</head>
<body class="bg-ink-950 text-gray-200 font-sans min-h-screen">

  <!-- ============ AUTH SCREEN ============ -->
  <div id="authScreen" class="min-h-screen flex items-center justify-center px-4">
    <div class="w-full max-w-sm fade-in">
      <div class="text-center mb-8">
        <div class="mx-auto w-14 h-14 rounded-2xl bg-gradient-to-br from-blood-600 to-ink-900 flex items-center justify-center text-2xl font-bold shadow-lg shadow-blood-700/20 mb-4">ع</div>
        <h1 class="text-xl font-semibold text-white">Ilm al-Rijal — Панель управления</h1>
        <p id="authSubtitle" class="text-sm text-gray-500 mt-1">Войдите, чтобы продолжить</p>
      </div>

      <div id="bootstrapNotice" class="hidden mb-4 text-xs bg-blood-700/10 border border-blood-700/30 text-blood-400 rounded-lg px-3 py-2">
        Пользователи не найдены. Создайте первый аккаунт администратора.
      </div>

      <form id="authForm" class="space-y-4 bg-ink-900 border border-ink-700 rounded-2xl p-6 shadow-xl">
        <div>
          <label class="block text-xs uppercase tracking-wide text-gray-500 mb-1">Логин</label>
          <input id="authUsername" name="username" autocomplete="username" required
            class="w-full bg-ink-850 border border-ink-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blood-600 focus:border-transparent" />
        </div>
        <div>
          <label class="block text-xs uppercase tracking-wide text-gray-500 mb-1">Пароль</label>
          <input id="authPassword" name="password" type="password" autocomplete="current-password" required
            class="w-full bg-ink-850 border border-ink-700 rounded-lg px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blood-600 focus:border-transparent" />
        </div>
        <div id="authError" class="hidden text-sm text-blood-400 bg-blood-700/10 border border-blood-700/30 rounded-lg px-3 py-2"></div>
        <button type="submit" id="authSubmit"
          class="w-full bg-blood-600 hover:bg-blood-500 transition-colors text-white text-sm font-medium py-2.5 rounded-lg shadow-lg shadow-blood-700/20">
          Войти
        </button>
      </form>
      <p class="text-center text-xs text-gray-600 mt-6">Ilm al-Rijal · защищённая зона</p>
    </div>
  </div>

  <!-- ============ APP SHELL ============ -->
  <div id="appShell" class="hidden min-h-screen md:grid md:grid-cols-[240px_1fr]">
    <!-- Sidebar -->
    <aside class="hidden md:flex flex-col bg-ink-900 border-r border-ink-700 h-screen sticky top-0">
      <div class="px-5 py-5 border-b border-ink-700 flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-blood-600 to-ink-900 flex items-center justify-center font-bold">ع</div>
        <div>
          <div class="text-sm font-semibold text-white leading-tight">Ilm al-Rijal</div>
          <div class="text-[11px] text-gray-500">Admin panel</div>
        </div>
      </div>
      <nav id="navLinks" class="flex-1 overflow-y-auto py-3 text-sm"></nav>
      <div class="p-4 border-t border-ink-700">
        <div class="flex items-center gap-2 mb-3">
          <div id="userAvatar" class="w-8 h-8 rounded-full bg-blood-700/30 border border-blood-600/40 flex items-center justify-center text-xs font-semibold text-blood-300">A</div>
          <div class="min-w-0">
            <div id="userName" class="text-xs font-medium text-white truncate">—</div>
            <div id="userRole" class="text-[10px] text-gray-500 uppercase tracking-wide">—</div>
          </div>
        </div>
        <button id="logoutBtn" class="w-full text-xs text-gray-400 hover:text-blood-400 border border-ink-700 hover:border-blood-700/50 rounded-lg py-2 transition-colors">Выйти</button>
      </div>
    </aside>

    <!-- Mobile top bar -->
    <div class="md:hidden sticky top-0 z-30 bg-ink-900/95 backdrop-blur border-b border-ink-700 px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-blood-600 to-ink-900 flex items-center justify-center text-sm font-bold">ع</div>
        <span class="text-sm font-semibold text-white">Ilm al-Rijal</span>
      </div>
      <button id="mobileMenuBtn" class="p-2 rounded-lg border border-ink-700 text-gray-300">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
    </div>
    <div id="mobileNav" class="hidden md:hidden fixed inset-0 z-40 bg-black/70">
      <div class="absolute right-0 top-0 bottom-0 w-72 bg-ink-900 border-l border-ink-700 p-4 flex flex-col">
        <div class="flex justify-between items-center mb-4">
          <span class="text-sm font-semibold text-white">Меню</span>
          <button id="mobileNavClose" class="p-1 text-gray-400">✕</button>
        </div>
        <nav id="mobileNavLinks" class="flex-1 overflow-y-auto text-sm"></nav>
        <button id="mobileLogoutBtn" class="mt-4 w-full text-xs text-gray-400 hover:text-blood-400 border border-ink-700 rounded-lg py-2">Выйти</button>
      </div>
    </div>

    <!-- Main content -->
    <main class="p-4 md:p-8 max-w-6xl mx-auto w-full">
      <div id="toast" class="hidden fixed top-4 right-4 z-50 max-w-xs px-4 py-3 rounded-xl shadow-2xl text-sm fade-in"></div>
      <div id="view" class="fade-in"></div>
    </main>
  </div>

  <script src="/admin/app.js"></script>
</body>
</html>
