<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080909">
<meta id="pageDescription" name="description" content="Библиотека хадисов — Аль-Кафи и другие шиитские источники">
<script src="/site-lang.js"></script>
<script src="/translator.js"></script>
<title>Библиотека хадисов | ShiaIsnad</title>
<!-- Site icon / Android PWA icon (абсолютные пути: страница живёт в /hadis/) -->
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Same dark red/black tokens as the main index (SHIAWAY VISUAL OVERRIDES) —
     keeps this page visually part of the same site. */
  --ink: #080909;
  --ink-1: #0d0f0f;
  --ink-2: #111313;
  --ink-3: #151717;
  --teal: #e21b30;
  --teal-glow: rgba(226,27,48,.16);
  --teal-light: #ff3948;
  --amber: #ff6b76;
  --amber-glow: rgba(255,107,118,.16);
  --rose: #ff3948;
  --gold: #e21b30;
  --gold-glow: rgba(226,27,48,.18);
  --text: #f4f2ef;
  --text-2: #b7b7bc;
  --text-3: #777;
  --border: #242626;
  --border-bright: rgba(255,255,255,.10);
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 20px 60px rgba(0,0,0,.36);
  --shadow-sm: 0 6px 18px rgba(0,0,0,.22);
  --font-display: 'Inter', Arial, sans-serif;
  --font-serif-body: 'Inter', Arial, sans-serif;
  --font-body: 'Inter', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --header-h: 60px;
  --bottom-nav-height: 72px;
  --tabbar-h: var(--bottom-nav-height);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;font-size:16px;scroll-behavior:smooth;overscroll-behavior:none;overflow-x:hidden;}
body{
  font-family:var(--font-body);
  background:var(--ink);
  color:var(--text);
  min-height:100%;
  position:relative;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(30deg,#fff 1px,transparent 1px),
    linear-gradient(150deg,#fff 1px,transparent 1px);
  background-size:90px 52px;
  mask-image:linear-gradient(90deg,black,transparent 65%);
  opacity:.035;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(226,27,48,.14), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 110%, rgba(255,57,72,.08), transparent 55%);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* HEADER */
.hd-header{
  position:sticky;top:0;z-index:20;height:var(--header-h);
  display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg, var(--ink-1), var(--ink));
  border-bottom:1px solid var(--border-bright);
  box-shadow:var(--shadow-sm);
}
.hd-back{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink-2);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);flex-shrink:0;
}
.hd-titles{flex:1;min-width:0;}
.hd-title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-sub{font-size:11px;color:var(--text-3);letter-spacing:.03em;}
.hd-search-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);
}

.hadith-text.hd-loading{color:var(--text-3);font-style:italic;font-family:var(--font-body);font-size:14px;}

/* SEARCH BAR */
.search-bar{
  position:sticky;top:var(--header-h);z-index:19;
  background:var(--ink);border-bottom:1px solid var(--border);
  padding:10px 14px;display:none;gap:8px;
}
.search-bar.open{display:flex;}
.search-bar input{
  flex:1;background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 12px;font-size:14px;color:var(--text);font-family:var(--font-body);
}
.search-bar input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}

/* BREADCRUMB */
.crumb{
  padding:10px 14px 4px;font-size:12px;color:var(--text-3);display:flex;
  align-items:center;gap:6px;flex-wrap:wrap;
}
.crumb span.seg{cursor:pointer;color:var(--teal);}
.crumb span.seg:hover{text-decoration:underline;}
.crumb span.sep{color:var(--text-3);}
.crumb span.cur{color:var(--text-2);font-weight:600;}

/* MAIN */
main{position:relative;z-index:1;padding:10px 14px calc(var(--bottom-nav-height) + 24px + env(safe-area-inset-bottom, 0px));max-width:840px;margin:0 auto;}

/* BOOK LIST */
.book-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;transition:transform .15s, box-shadow .15s;
}
.book-card:active{transform:scale(.985);}
.book-num{
  font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--gold);
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border-bright);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ink-1);
}
.book-info{flex:1;min-width:0;}
.book-title{font-family:var(--font-serif-body);font-size:16.5px;font-weight:600;line-height:1.3;color:var(--text);}
.book-meta{font-size:11.5px;color:var(--text-3);margin-top:3px;font-family:var(--font-mono);}
.book-chev{color:var(--text-3);flex-shrink:0;}

/* CHAPTER LIST */
.chapter-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
}
.chapter-card:active{transform:scale(.985);}
.chapter-num{
  font-family:var(--font-mono);font-size:12px;color:var(--text-3);
  width:28px;height:28px;border-radius:6px;background:var(--ink-1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.chapter-info{flex:1;min-width:0;}
.chapter-title{font-family:var(--font-serif-body);font-size:15.5px;font-weight:600;line-height:1.3;}
.chapter-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
.chapter-category{font-size:10px;color:var(--gold);text-transform:none;letter-spacing:.02em;margin-bottom:3px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* HADITH CARD */
.hadith-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);position:relative;
}
.hadith-card::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg, var(--gold), var(--amber));border-radius:2px;
}
.hadith-num{
  font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.05em;
  font-weight:600;margin-bottom:6px;display:block;
}
.hadith-text{
  font-family:var(--font-serif-body);font-size:17px;line-height:1.6;color:var(--text);
}

/* EMPTY / LOADING */
.state-msg{
  text-align:center;padding:60px 20px;color:var(--text-3);font-family:var(--font-serif-body);font-size:15px;
}
.spinner{
  width:28px;height:28px;border-radius:50%;border:3px solid var(--border);
  border-top-color:var(--gold);animation:spin 0.8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* SEARCH RESULTS */
.result-highlight{background:var(--gold-glow);color:var(--text);border-radius:2px;padding:0 1px;}
.result-path{font-size:11px;color:var(--text-3);margin-bottom:4px;font-family:var(--font-mono);}
.btn-online-search{
  width:100%;padding:12px;border-radius:10px;border:1px solid var(--border-bright);
  background:var(--ink-1);color:var(--gold);font-family:var(--font-body);font-size:14px;
  font-weight:600;cursor:pointer;
}
.btn-online-search:disabled{opacity:.55;cursor:default;}
.btn-online-search:active{transform:scale(.98);}

/* BOTTOM NAV (matches main site tab bar) */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(180deg, var(--ink-1), var(--ink));
  border-top:1px solid var(--border-bright);box-shadow:0 -6px 20px rgba(58,40,16,.14);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.tab-bar-inner{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));height:var(--bottom-nav-height);max-width:840px;margin:0 auto;}
.tab-btn{
  min-width:0;width:100%;height:var(--bottom-nav-height);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-3);font-size:11px;font-family:var(--font-body);
}
.tab-btn.active{color:var(--gold);}
.tab-btn svg{width:26px;height:26px;stroke-width:1.8;transition:transform .2s;}
.tab-btn.active svg{transform:scale(1.1);filter:drop-shadow(0 0 5px rgba(226,27,48,.16));}

/* SCROLL TOP FAB */
.fab-top{
  position:fixed;right:16px;bottom:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 16px);z-index:25;
  width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;border:none;
  box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;
}
.fab-top.show{display:flex;}

/* ── ИИ-ЧАТ ПО ЛОКАЛЬНОЙ БИБЛИОТЕКЕ ХАДИСОВ ── */
.chat-wrap{display:flex;flex-direction:column;min-height:calc(100vh - var(--header-h) - var(--bottom-nav-height) - 40px);}
.chat-msgs{flex:1;padding:12px 2px 10px;display:flex;flex-direction:column;gap:10px;}
.chat-bubble{max-width:88%;padding:10px 13px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word;box-shadow:var(--shadow-sm);}
.chat-bubble.user{align-self:flex-end;background:var(--teal);color:#fdf6e3;border-bottom-right-radius:4px;}
.chat-bubble.ai{align-self:flex-start;background:var(--ink-2);border:1px solid var(--border);color:var(--text);border-bottom-left-radius:4px;}
.chat-bubble.ai.thinking{color:var(--text-3);font-style:italic;box-shadow:none;}
.chat-bubble.ai.err{color:var(--rose);border-color:var(--rose);}
.chat-hint{font-size:11.5px;color:var(--text-3);text-align:center;padding:4px 20px 8px;}
.chat-input-bar{position:fixed;left:0;right:0;bottom:var(--tabbar-h);display:none;align-items:flex-end;gap:8px;padding:9px 12px;background:var(--ink);border-top:1px solid var(--border);z-index:18;}
.chat-input-bar.open{display:flex;}
.chat-input-bar textarea{flex:1;resize:none;max-height:110px;border-radius:12px;border:1px solid var(--border-bright);background:var(--ink-2);color:var(--text);font-family:var(--font-body);font-size:14px;padding:10px 12px;line-height:1.4;}
.chat-input-bar textarea:focus{outline:none;border-color:var(--teal-light);}
.chat-send-btn{width:42px;height:42px;border-radius:50%;border:none;background:var(--teal);color:#fdf6e3;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.chat-send-btn:disabled{opacity:.45;}

/* ── Язык: RTL и перевод ── */
html[lang="ar"] body, html[lang="ar"] button, html[lang="ar"] input, html[lang="ar"] textarea{font-family:'Noto Naskh Arabic','Inter',system-ui,sans-serif;}
html[dir="rtl"] .hd-back svg, html[dir="rtl"] .book-chev svg{transform:scaleX(-1);}
html[dir="rtl"] .hadith-card::before, html[dir="rtl"] .book-card::before, html[dir="rtl"] .chapter-card::before{left:auto;right:0;}
html[dir="rtl"] .fab-top{right:auto;left:16px;}
html[dir="rtl"] .chat-bubble.user{border-bottom-right-radius:14px;border-bottom-left-radius:4px;}
html[dir="rtl"] .chat-bubble.ai{border-bottom-left-radius:14px;border-bottom-right-radius:4px;}
html[dir="rtl"] .chapter-category{white-space:normal;}
.hd-lang-btn{height:36px;min-width:42px;padding:0 10px;border-radius:18px;border:1px solid var(--border);background:var(--ink-2);color:var(--text-2);font-family:var(--font-mono);font-size:11px;cursor:pointer;flex-shrink:0;}
.hd-lang-btn:hover{border-color:var(--gold);color:var(--text);}
.tr-row{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:11px;color:var(--text-3);}
.tr-toggle{background:none;border:none;color:var(--gold);cursor:pointer;font-size:11px;padding:0;text-decoration:underline;}
.chat-bubble strong{font-weight:700;}
</style>
</head>
<body>

<header class="hd-header">
  <button class="hd-back" id="backBtn" data-i18n-title="back" data-i18n-aria="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="hd-titles">
    <div class="hd-title" id="hdTitle"></div>
    <div class="hd-sub" id="hdSub"></div>
  </div>
  <button class="hd-lang-btn" id="langBtn" type="button" data-i18n-aria="langButtonAria">RU</button>
  <button class="hd-search-btn" id="searchToggle" data-i18n-title="search" data-i18n-aria="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
</header>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" data-i18n-ph="searchPh" placeholder="" autocomplete="off">
</div>

<div class="crumb" id="crumb"></div>

<main id="mainArea">
  <div class="state-msg"><div class="spinner"></div><span data-i18n="loading"></span></div>
</main>

<button class="fab-top" id="fabTop" data-i18n-title="top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<nav class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn" id="navRijal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span data-i18n="tabRijal"></span>
    </button>
    <button class="tab-btn active" id="navHadis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span data-i18n="tabHadis"></span>
    </button>
    <button class="tab-btn" id="navChat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
      <span data-i18n="tabChat"></span>
    </button>
  </div>
</nav>

<div class="chat-input-bar" id="chatInputBar">
  <textarea id="chatInput" rows="1" data-i18n-ph="chatPh" placeholder=""></textarea>
  <button class="chat-send-btn" id="chatSendBtn" data-i18n-title="send" data-i18n-aria="send">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
  </button>
</div>

<script>

  // Полная загрузка всех книг (ensureAllBooksLoaded) запускается лениво — только

  var bookCache = {};
  var allBooksLoaded = false;

      library:'مكتبة الأحاديث', allBooks:'جميع الكتب', book:'كتاب', chapter:'باب', hadithWord:'حديث',

  // ── Запросы к воркеру с таймаутом (чат и интернет-поиск) ──
  async function postAi(body, extraHeaders, timeoutMs){
    var controller = new AbortController();
    var timer = setTimeout(function(){ controller.abort(); }, timeoutMs || 60000);
    try {
      var headers = Object.assign({ 'Content-Type': 'application/json' }, extraHeaders || {});
      var res = await fetch('/ai/chat', { method: 'POST', headers: headers, body: JSON.stringify(body), signal: controller.signal });
      var data = await res.json().catch(function(){ return {}; });
      var reply = (data && data.content && data.content[0] && data.content[0].text) ||
        (data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      return { ok: res.ok, reply: String(reply || '').trim(), error: data && data.error };
    } catch (e) {
      return { ok: false, reply: '', error: e && e.name === 'AbortError' ? L('timeout') : L('netError') };
    } finally {
      clearTimeout(timer);
    }
  }

  function fetchBook(id){

      if (!r.ok) throw new Error('HTTP ' + r.status);

  function ensureAllBooksLoaded(){

  function esc(s){
    return String(s || '').replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // Нормализация текста для поиска (та же идея, что и в риджале на главной
  // странице): убирает разницу ё/е и вариации арабских букв, из-за которых
  // локальный поиск по хадисам раньше не находил совпадения при малейшей
  // разнице в написании запроса и текста хадиса.
  function normalizeSearchText(s){
    if (!s) return '';
    return String(s)
      .toLowerCase()
      .replace(/ё/g, 'е')
      .replace(/[\u064B-\u0652\u0670\u06D6-\u06ED]/g, '')
      .replace(/\u0640/g, '')
      .replace(/[آأإٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/[ىی]/g, 'ي')
      .replace(/ؤ/g, 'و')
      .replace(/ئ/g, 'ي')
      .replace(/ء/g, '');
  }

  function searchWords(query){
    return normalizeSearchText(query).split(/[^a-zа-яё0-9\u0600-\u06FF]+/i).filter(function(w){ return w.length >= 2; });
  }

  // целиком, как раньше) — раньше подсветка (и по сути сам локальный поиск
  // в renderSearch) требовала точного вхождения всей фразы целиком, из-за
  // чего "плохо искало" при запросе из нескольких слов не в том порядке.
  function highlight(text, q){
    var words = searchWords(q);
    if (!words.length) return esc(text);
    var escaped = words
      .slice()
      .sort(function(a, b){ return b.length - a.length; })
      .map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    var re = new RegExp('(' + escaped.join('|') + ')', 'gi');
    return esc(text).replace(re, function(m){ return '<mark class="result-highlight">' + m + '</mark>'; });
  }

  // ── ИИ-чат: строго по локальному локальная библиотека, без веба и без риджаля ──
  function getFlatHadith(){
    if (flatHadithCache) return flatHadithCache;
    flatHadithCache = [];
    (booksIndex || []).forEach(function(meta){
      var book = bookCache[meta.id];
      if (!book) return;
      (book.chapters || []).forEach(function(ch){
        (ch.h || []).forEach(function(h){
          if (!h || !h.text) return;
          var item = {
            bookId: book.id,
            bookTitle: book.title || '',
            chapterN: ch.n,
            chapterName: ch.name || '',
            category: ch.category || '',
            hadithId: h.id,
            text: h.text,
          };
          // Предпосчитываем нормализованный "слепок" один раз при сборке
          // плоского списка — а не на каждый символ поиска для тысяч
          // хадисов (это и есть "ускорь поиск" для локальной базы).
          item._blob = normalizeSearchText(item.text + ' ' + item.bookTitle + ' ' + item.chapterName);
          flatHadithCache.push(item);
        });
      });
    });
    return flatHadithCache;
  }

  function findLocalHadith(query, limit){
    var flat = getFlatHadith();
    var words = searchWords(query);
    if (!flat.length || !words.length) return [];
    var scored = [];
    flat.forEach(function(item){
      var hay = item._blob || normalizeSearchText(item.text + ' ' + item.bookTitle + ' ' + item.chapterName);
      var score = 0;
      words.forEach(function(w){ if (hay.indexOf(w) !== -1) score++; });
      if (score > 0) scored.push({ item: item, score: score });
    });
    scored.sort(function(a, b){ return b.score - a.score; });
    return scored.slice(0, limit || 6).map(function(s){ return s.item; });
  }

  function buildWebHadithSystemPrompt(){

      'Обязательно укажи, из какого источника взят ответ. Если надёжного источника не нашлось — прямо ' +
      'скажи об этом и предложи переформулировать запрос; не выдумывай текст, номер хадиса или книгу. ' +
      'Пиши на языке вопроса пользователя, коротко и по делу.' + langDirective()
    );
  }

  function scrollChatToBottom(){
    var el = document.getElementById('chatMsgs');
    if (el) el.scrollTop = el.scrollHeight;
  }

  // Лёгкий Markdown для ответов ИИ: **жирный** (текст экранируется до разметки)
  function chatHtml(text){
    return esc(text).replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
  }

  function renderChatMessages(){
    var el = document.getElementById('chatMsgs');
    if (!el) return;
    if (!chatHistory.length) {
      el.innerHTML = '<div class="chat-bubble ai" dir="auto">' + esc(L('chatWelcome')) + '</div>';
      return;
    }
    el.innerHTML = chatHistory.map(function(m){
      var cls = 'chat-bubble ' + (m.role === 'user' ? 'user' : 'ai') + (m.thinking ? ' thinking' : '') + (m.err ? ' err' : '');
      return '<div class="' + cls + '" dir="auto">' + chatHtml(m.thinking ? L('thinking') : m.content) + '</div>';
    }).join('');
    scrollChatToBottom();
  }

  function renderChat(){
    // Открытие чата — сигнал, что скоро понадобится полная база; запускаем
    // её фоновую догрузку заранее, чтобы к моменту вопроса она уже была готова.
    ensureAllBooksLoaded().then(function(){
      if (state.view === 'chat') hdSub.textContent = L('chatSub') + ' (' + getFlatHadith().length + ')';
    });
    var totalKnown = (booksIndex || []).reduce(function(sum, b){ return sum + b.hadithCount; }, 0);
    hdTitle.textContent = L('chatTitle');
    hdSub.textContent = L('chatSub') + ' (' + totalKnown + ')';
    setCrumb([{ label: L('tabHadis'), action: 'books' }, { label: L('tabChat') }]);
    mainArea.innerHTML =
      '<div class="chat-wrap"><div class="chat-msgs" id="chatMsgs"></div>' +
      '<div class="chat-hint">' + esc(L('chatHint')) + '</div></div>';
    renderChatMessages();
  }

  async function sendChatMessage(){
    if (chatBusy) return;                                   // защита от двойной отправки (Enter + клик)
    var input = document.getElementById('chatInput');
    var sendBtn = document.getElementById('chatSendBtn');
    var text = (input.value || '').trim();
    if (!text) return;
    chatBusy = true;

    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    chatHistory.push({ role: 'user', content: text });
    var thinkingIdx = chatHistory.length;
    chatHistory.push({ role: 'assistant', content: '', thinking: true });
    renderChatMessages();

    try {
      // Дожидаемся полной загрузки ВСЕХ книг (лениво), иначе поиск мог бы ошибочно
      // ничего не найти просто потому, что докачаны не все книги.
      try { await ensureAllBooksLoaded(); } catch (e) {}

      // Арабский вопрос: тексты хадисов в базе русские → ищем и по русскому эквиваленту запроса.
      var ruQ = await russianQuery(text);
      var matches = findLocalHadith(ruQ ? (text + ' ' + ruQ) : text, 6);
      var hasLocalMatches = matches.length > 0;
      // Есть локальные совпадения → строгий режим (X-Hadith-Strict: только локальная база).
      // Нет → воркер сам ищет источники в интернете (collectSourceContext).
      var systemText = hasLocalMatches ? buildStrictHadithSystemPrompt(matches) : buildWebHadithSystemPrompt();
      var apiMessages = chatHistory
        .filter(function(m){ return !m.thinking && m.content && !m.err; })
        .slice(-12)
        .map(function(m){ return { role: m.role, content: m.content }; });

      var r = await postAi({ max_tokens: 900, temperature: 0.3, system: systemText, messages: apiMessages },
        hasLocalMatches ? { 'X-Hadith-Strict': '1' } : {}, 60000);
      if (!r.ok || !r.reply) {
        chatHistory[thinkingIdx] = { role: 'assistant', content: r.error || L('noAnswer'), err: true };
      } else {
        chatHistory[thinkingIdx] = { role: 'assistant', content: r.reply };
      }
    } catch (e) {
      chatHistory[thinkingIdx] = { role: 'assistant', content: L('netError'), err: true };
    } finally {
      chatBusy = false;
      sendBtn.disabled = false;
      if (state.view === 'chat') renderChatMessages();
    }
  }

  function render(){
    if (!booksIndex) return;
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});

    var chatBar = document.getElementById('chatInputBar');
    var searchBtn = document.getElementById('searchToggle');
    var isChat = state.view === 'chat';
    if (chatBar) chatBar.classList.toggle('open', isChat);
    if (searchBtn) searchBtn.style.display = isChat ? 'none' : '';
    document.getElementById('navHadis').classList.toggle('active', !isChat);
    document.getElementById('navChat').classList.toggle('active', isChat);

    if (isChat) return renderChat();
    if (state.query) return renderSearch();
    if (state.view === 'books') return renderBooks();
    if (state.view === 'chapters') return renderChapters();
    if (state.view === 'hadiths') return renderHadiths();
  }

  function renderBooks(){
    var target = translateTarget();
    var totalBooks = booksIndex.length;
    var totalH = booksIndex.reduce(function(sum, b){ return sum + b.hadithCount; }, 0);
    hdTitle.textContent = L('library');
    hdSub.textContent = totalH + ' ' + plural(totalH,'hadith') + ' · ' + totalBooks + ' ' + plural(totalBooks,'book');
    setCrumb([{label:L('allBooks')}]);
    var html = '';
    booksIndex.forEach(function(book){
      html += '<div class="book-card" data-book="' + book.id + '">' +
        '<div class="book-num">' + book.id + '</div>' +
        '<div class="book-info"><div class="book-title" dir="auto"' + (target && uiLang()==='fa' && Translator.cached(book.title || '', 'fa') === null ? ' data-tr="' + esc(book.title || '') + '"' : '') + '>' + esc(bookTitle(book)) + '</div>' +
        '<div class="book-meta">' + book.chaptersCount + ' ' + plural(book.chaptersCount,'chapter') + ' · ' + book.hadithCount + ' ' + plural(book.hadithCount,'hadith') + '</div></div>' +
        '<div class="book-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg></div>' +
      '</div>';
    });
    mainArea.innerHTML = html;
    if (target && mainArea.querySelector('[data-tr]')) fillTranslations(mainArea, target);
    mainArea.querySelectorAll('.book-card').forEach(function(el){
      el.addEventListener('click', function(){
        var id = parseInt(el.getAttribute('data-book'), 10);
        // Нажатие на книгу качает ТОЛЬКО её файл (hadis/books/<id>.json),
        // а не всю базу хадисов.
        state.bookId = id;
        state.view = 'chapters';
        openBook(id, render);
      });
    });
  }

  // Заполняет элементы [data-tr] переводом лениво (кэш «оригинал+язык → перевод»); оригинал в данных не меняется.
  function fillTranslations(root, target){
    var token = state.view + '|' + state.bookId + '|' + state.chapterN;
    Translator.fillLazy(root, target, {
      shouldStop: function(){ return (state.view + '|' + state.bookId + '|' + state.chapterN) !== token || translateTarget() !== target; }
    });
  }

  function getBook(id){
    return bookCache[id];
  }

  function renderChapters(){
    var book = getBook(state.bookId);
    if (!book) { state.view = 'books'; return render(); }
    var target = translateTarget();
    var titleLine = bookTitle(book);
    hdTitle.textContent = L('book') + ' ' + book.id;
    hdSub.textContent = titleLine;
    setCrumb([{label:L('allBooks'), action:'books'}, {label:L('book') + ' ' + book.id}]);
    var html = '<div dir="auto" style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:4px 0 14px;line-height:1.3;">' + esc(titleLine) + '</div>';
    book.chapters.forEach(function(ch){
      var name = ch.name || (L('chapter') + ' ' + ch.n);
      var cat = ch.category || '';
      var nameAttr = '', catAttr = '';
      if (target && ch.name) { var c1 = Translator.cached(ch.name, target); if (c1 !== null) name = c1; else nameAttr = ' data-tr="' + esc(ch.name) + '"'; }
      if (target && cat) { var c2 = Translator.cached(cat, target); if (c2 !== null) cat = c2; else catAttr = ' data-tr="' + esc(ch.category) + '"'; }
      html += '<div class="chapter-card" data-ch="' + ch.n + '">' +
        '<div class="chapter-num">' + ch.n + '</div>' +
        '<div class="chapter-info">' +
        '<div class="chapter-category" dir="auto"' + catAttr + '>' + esc(cat) + '</div>' +
        '<div class="chapter-title" dir="auto"' + nameAttr + '>' + esc(name) + '</div>' +
        '<div class="chapter-meta">' + ch.h.length + ' ' + plural(ch.h.length,'hadith') + '</div></div>' +
      '</div>';
    });
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.chapter-card').forEach(function(el){
      el.addEventListener('click', function(){
        state.chapterN = parseInt(el.getAttribute('data-ch'), 10);
        state.view = 'hadiths';
        render();
      });
    });
    if (target && mainArea.querySelector('[data-tr]')) fillTranslations(mainArea, target);
  }

  function renderHadiths(){
    var book = getBook(state.bookId);
    if (!book) { state.view = 'books'; return render(); }
    var ch = book.chapters.find(function(c){ return c.n === state.chapterN; });
    if (!ch) { state.view = 'chapters'; return render(); }
    var target = translateTarget();
    hdTitle.textContent = L('chapter') + ' ' + ch.n;
    hdSub.textContent = bookTitle(book);
    setCrumb([{label:L('allBooks'), action:'books'}, {label:L('book') + ' ' + book.id, action:'chapters'}, {label:L('chapter') + ' ' + ch.n}]);
    var chName = ch.name || '', chCat = ch.category || '', chNameAttr = '', chCatAttr = '';
    if (target && chName) { var t1 = Translator.cached(chName, target); if (t1 !== null) chName = t1; else chNameAttr = ' data-tr="' + esc(ch.name) + '"'; }
    if (target && chCat) { var t2 = Translator.cached(chCat, target); if (t2 !== null) chCat = t2; else chCatAttr = ' data-tr="' + esc(ch.category) + '"'; }
    var html = '<div style="margin:4px 0 14px;">' +
      '<div class="chapter-category" dir="auto" style="margin-bottom:4px;"' + chCatAttr + '>' + esc(chCat) + '</div>' +
      '<div dir="auto" style="font-family:var(--font-serif-body);font-size:16px;font-weight:600;color:var(--text-2);"' + chNameAttr + '>' + esc(chName) + '</div></div>';
    viewTexts = {};
    ch.h.forEach(function(h, i){
      var key = book.id + '_' + ch.n + '_' + i;
      var orig = h.text || '';
      var sourceNo = (h && h.id !== undefined && h.id !== null) ? h.id : (i + 1);
      // Арабский режим: если в данных есть настоящий арабский оригинал (arabicText,
      // книги 9–13) — показываем его напрямую и НЕ отправляем на перевод.
      var directAr = (target === 'ar' && h.arabicText) ? String(h.arabicText) : null;
      var tr = directAr !== null ? directAr : (target ? Translator.cached(orig, target) : null);
      viewTexts[key] = { orig: orig, tr: tr, showTr: !!target };
      var shown = (target && tr !== null) ? tr : orig;
      var pendingAttr = (target && tr === null) ? ' data-tr="' + esc(orig) + '"' : '';
      var noteTxt = directAr !== null ? L('arabicOriginal') : (tr !== null ? L('machineTr') : L('trWait'));
      html += '<div class="hadith-card" data-hkey="' + key + '"><span class="hadith-num">' + L('hadithWord') + ' №' + esc(sourceNo) + '</span>' +
        '<div class="hadith-text' + (pendingAttr ? ' hd-loading' : '') + '" dir="auto"' + pendingAttr + '>' + esc(shown) + '</div>' +
        (target ? '<div class="tr-row"><span class="tr-note">' + noteTxt + '</span><button class="tr-toggle" type="button">' + (tr !== null ? L('showOrig') : '') + '</button></div>' : '') +
        '</div>';
    });
    mainArea.innerHTML = html;

    if (target) {
      var token = state.bookId + '|' + state.chapterN;
      Translator.fillLazy(mainArea, target, {
        shouldStop: function(){ return state.view !== 'hadiths' || (state.bookId + '|' + state.chapterN) !== token || translateTarget() !== target; },
        onItem: function(n, tr){
          var card = n.closest('.hadith-card'); if (!card) return;
          var v = viewTexts[card.getAttribute('data-hkey')]; if (v) { v.tr = tr; v.showTr = true; }
          var row = card.querySelector('.tr-row');
          if (row) { row.querySelector('.tr-note').textContent = L('machineTr'); row.querySelector('.tr-toggle').textContent = L('showOrig'); }
        },
        onFail: function(n){
          n.classList.remove('hd-loading');
          var card = n.closest('.hadith-card'); var row = card && card.querySelector('.tr-row');
          if (row) row.querySelector('.tr-note').textContent = L('trFail');
        }
      });
    }
  }

  // Переключатель «оригинал / перевод» (делегирование, один обработчик на страницу)
  mainArea.addEventListener('click', function(e){
    var btn = e.target.closest && e.target.closest('.tr-toggle');
    if (!btn) return;
    var card = btn.closest('.hadith-card'); if (!card) return;
    var v = viewTexts[card.getAttribute('data-hkey')]; if (!v || v.tr === null) return;
    v.showTr = !v.showTr;
    card.querySelector('.hadith-text').textContent = v.showTr ? v.tr : v.orig;
    btn.textContent = v.showTr ? L('showOrig') : L('showTr');
    // Для «прямого арабского» (arabicText) «оригинал» — это русский текст базы, и наоборот
  });

  function renderSearch(){
    hdTitle.textContent = L('search');
    hdSub.textContent = '«' + state.query + '»';

    // Полнотекстовый поиск требует всех книг сразу — если ещё не всё загружено,
    // показываем спиннер и дозагружаем базу в фоне (один раз), затем перерисовываем.
    if (!allBooksLoaded) {
      mainArea.innerHTML = '<div class="state-msg"><div class="spinner"></div>' + L('loadingSearch') + '</div>';
      ensureAllBooksLoaded().then(function(){ if (state.query) render(); });
      return;
    }

    // Арабский запрос: ищем и по русскому переводу запроса (перевод кэшируется).
    var q = state.query;
    var ru = '';
    if (hasArabic(q)) {
      var cachedRu = Translator.cached(q, 'ru');
      if (cachedRu === null) {
        mainArea.innerHTML = '<div class="state-msg"><div class="spinner"></div>' + L('translatingQuery') + '</div>';
        russianQuery(q).then(function(){ if (state.query === q && state.view !== 'chat') render(); });
        return;
      }
      ru = cachedRu !== q ? cachedRu : '';
    }

    var searchQ = ru ? (q + ' ' + ru) : q;
    var words = searchWords(searchQ);
    var scored = [];
    if (words.length) {
      // getFlatHadith() хранит предпосчитанные нормализованные тексты — быстрее, чем нормализация на каждый символ.
      getFlatHadith().forEach(function(item){
        var hay = item._blob;
        var score = 0;
        words.forEach(function(w){ if (hay.indexOf(w) !== -1) score++; });
        if (score > 0) scored.push({ item: item, score: score });
      });
      scored.sort(function(a, b){
        return (b.score - a.score) || (a.item.bookId - b.item.bookId) || (a.item.chapterN - b.item.chapterN) || ((a.item.hadithId || 0) - (b.item.hadithId || 0));
      });
    }
    var results = scored;
    setCrumb([{label:L('allBooks'), action:'books'}, {label:L('results') + ': ' + results.length}]);

    var html = '';
    if (!results.length) {
      html += '<div class="state-msg">' + esc(L('nothing')) + ' «' + esc(q) + '» ' + esc(L('inLocal')) + '</div>' +
        '<div style="padding:0 16px 16px;"><button class="btn-online-search" id="btnOnlineHadithSearch">' + esc(L('webSearch')) + '</button></div>' +
        '<div id="onlineSearchResult"></div>';
    } else {
      results.slice(0, 300).forEach(function(r){
        var it = r.item;
        var meta = (booksIndex || []).filter(function(m){ return m.id === it.bookId; })[0];
        var title = meta ? bookTitle(meta) : it.bookTitle;
        html += '<div class="hadith-card" data-book="' + it.bookId + '" data-ch="' + it.chapterN + '" style="cursor:pointer;">' +
          '<div class="result-path" dir="auto">' + esc(title) + (it.category ? ' · ' + esc(it.category) : '') + ' · ' + esc(L('chapter')) + ' ' + it.chapterN + ' · №' + esc(it.hadithId) + '</div>' +
          '<div class="hadith-text" dir="auto">' + highlight(it.text, searchQ) + '</div>' +
        '</div>';
      });
      if (results.length > 300) {
        html += '<div class="state-msg">' + esc(L('first300').replace('{n}', results.length)) + '</div>';
      }
      html += '<div style="padding:0 16px 16px;"><button class="btn-online-search" id="btnOnlineHadithSearch">' + esc(L('alsoWeb')) + '</button></div>' +
        '<div id="onlineSearchResult"></div>';
    }
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.hadith-card[data-book]').forEach(function(el){
      el.addEventListener('click', function(){
        state.query = '';
        document.getElementById('searchInput').value = '';
        document.getElementById('searchBar').classList.remove('open');
        state.bookId = parseInt(el.getAttribute('data-book'), 10);
        state.chapterN = parseInt(el.getAttribute('data-ch'), 10);
        state.view = 'hadiths';
        render();
      });
    });
    var onlineBtn = document.getElementById('btnOnlineHadithSearch');
    if (onlineBtn) onlineBtn.addEventListener('click', function(){ runOnlineHadithSearch(state.query); });
  }

  // Поиск хадиса в интернете (shiaisnad.ru, arsh313.com и другие шиитские
  // сайты/форумы — см. worker.js) — используется, когда локальная база
  // локальная библиотека не содержит нужного хадиса или для расширенной
  // проверки формулировки. В отличие от строгого ИИ-чата на этой странице,
  // здесь заголовок X-Hadith-Strict НЕ отправляется, поэтому воркер сам
  // ищет источники в интернете и подмешивает их в системный промпт.
  async function runOnlineHadithSearch(query){
    var box = document.getElementById('onlineSearchResult');
    var btn = document.getElementById('btnOnlineHadithSearch');
    if (!box || !query) return;
    if (btn) btn.disabled = true;
    box.innerHTML = '<div class="state-msg"><div class="spinner"></div>' + esc(L('searchingWeb')) + '</div>';
    var systemText =
      'Ты — ассистент библиотеки хадисов ShiaIsnad. Пользователь искал хадис по запросу «' + query + '», ' +
      'но в локальной библиотеке подходящего текста не нашлось (или недостаточно). ' +
      'Используй серверные источники (shiaisnad.ru, arsh313.com и другие шиитские сайты/форумы), ' +
      'если они подмешаны ниже, чтобы найти этот хадис. Обязательно укажи книгу/источник и, если есть, ' +
      'номер хадиса или главу. Если ничего надёжного не найдено — прямо скажи об этом, не выдумывай текст.' + langDirective();
    var r = await postAi({ max_tokens: 900, temperature: 0.3, system: systemText, messages: [{ role: 'user', content: query }] }, {}, 60000);
    if (!document.body.contains(box)) { if (btn) btn.disabled = false; return; }
    if (!r.ok || !r.reply) {
      box.innerHTML = '<div class="state-msg">' + esc(r.error || L('webFail')) + '</div>';
    } else {
      box.innerHTML = '<div class="hadith-card"><div class="result-path">' + esc(L('webResult')) + '</div><div class="hadith-text" dir="auto">' + chatHtml(r.reply) + '</div></div>';
    }
    if (btn) btn.disabled = false;
  }

  // Search bar toggle
  var searchBar = document.getElementById('searchBar');
  var searchInput = document.getElementById('searchInput');
  document.getElementById('searchToggle').addEventListener('click', function(){
    searchBar.classList.toggle('open');
    if (searchBar.classList.contains('open')) {
      searchInput.focus();
    }
  });
  var searchTimer;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var v = searchInput.value.trim();
    searchTimer = setTimeout(async function(){
      state.query = v.length >= 2 ? v : '';
      if(state.query){ try{ await ensureAllBooksLoaded(); }catch(e){} }
      render();
    }, 250);
  });

  // Back button
  document.getElementById('backBtn').addEventListener('click', function(){
    if (state.view === 'chat') { state.view = 'books'; return render(); }
    if (state.query) { state.query=''; searchInput.value=''; searchBar.classList.remove('open'); return render(); }
    if (state.view === 'hadiths') { state.view = 'chapters'; state.chapterN=null; return render(); }
    if (state.view === 'chapters') { state.view = 'books'; state.bookId=null; return render(); }
    window.location.href = '/';
  });

  // Bottom nav
  document.getElementById('navRijal').addEventListener('click', function(){ window.location.href = '/'; });
  document.getElementById('navHadis').addEventListener('click', function(){ state.view='books'; state.bookId=null; state.chapterN=null; state.query=''; render(); });
  document.getElementById('navChat').addEventListener('click', function(){ state.view='chat'; render(); });

  // Чат: отправка сообщения
  var chatInput = document.getElementById('chatInput');
  var chatSendBtn = document.getElementById('chatSendBtn');
  chatSendBtn.addEventListener('click', sendChatMessage);
  chatInput.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendChatMessage(); }
  });
  chatInput.addEventListener('input', function(){
    chatInput.style.height = 'auto';
    chatInput.style.height = Math.min(chatInput.scrollHeight, 110) + 'px';
  });

  // Переключатель языка (RU → AR → FA → RU) — меняет ОБЩИЙ язык сайта
  document.getElementById('langBtn').addEventListener('click', function(){
    if (window.SiteLang) { var l=curLang(); SiteLang.set(l==='ru' ? 'ar' : (l==='ar' ? 'fa' : 'ru')); }
  });
  // Язык изменился (здесь, на главной или в другой вкладке): перерисовываем интерфейс, оригиналы хадисов не затрагиваются
  window.addEventListener('sitelangchange', function(){
    applyStaticI18n();
    flatHadithCache = null;
    if (booksIndex) render();
  });
  applyStaticI18n();

  // Scroll-to-top FAB
  var fab = document.getElementById('fabTop');
  window.addEventListener('scroll', function(){
    if (window.scrollY > 400) fab.classList.add('show'); else fab.classList.remove('show');
  });
  fab.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });
})();
</script>
