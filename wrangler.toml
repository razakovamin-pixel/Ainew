name = "ilm-al-rijal"
main = "worker.js"
compatibility_date = "2025-01-01"

# Отдаёт index.html и любые другие статические файлы из ./public
[assets]
directory = "./public"
binding = "ASSETS"

# Секреты и реальные значения НЕ прописывайте здесь. После деплоя:
#   wrangler secret put AI_API_KEY
#   wrangler secret put AI_BASE_URL
#   wrangler secret put AI_MODEL
#   wrangler secret put TRANSLATE_MODEL
# (все можно хранить как secrets, а не просто vars, если не хотите
# светить даже провайдера и модель в конфиге репозитория)
#
# TRANSLATE_MODEL — отдельная (обычно более быстрая/дешёвая) модель
# специально для перевода интерфейса, карточек передатчиков, статусов
# и хадисов на арабский (и другие) языки. Используется только запросами
# с заголовком X-Translate: 1.
# Если секрет не задан — воркер попробует старое имя TRANSLATE_MODEL_AI,
# а если и его нет — использует жёстко заданную по умолчанию модель
# deepseek-v4-flash (самая быстрая и самая дешёвая из доступного списка,
# ×0.60) — так перевод всегда идёт быстрой моделью "из коробки".
# Чтобы выбрать другую модель — задайте секрет явно, например:
#   wrangler secret put TRANSLATE_MODEL
#   > deepseek-v4-flash
