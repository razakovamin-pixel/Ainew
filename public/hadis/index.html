<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#080909">
<meta id="pageDescription" name="description" content="Библиотека хадисов — Аль-Кафи и другие шиитские источники">
<title>Библиотека хадисов | ShiaIsnad</title>
<!-- Site icon / Android PWA icon (абсолютные пути: страница живёт в /hadis/) -->
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="64x64" href="../favicon.png">
<link rel="icon" type="image/png" sizes="192x192" href="../icon-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="../icon-192.png">
<link rel="manifest" href="../manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  /* Same dark red/black tokens as the main index (SHIAWAY VISUAL OVERRIDES) —
     keeps this page visually part of the same site. */
  --ink: #080909;
  --ink-1: #0d0f0f;
  --ink-2: #111313;
  --ink-3: #151717;
  --teal: #e21b30;
  --teal-glow: rgba(226,27,48,.16);
  --teal-light: #ff3948;
  --amber: #ff6b76;
  --amber-glow: rgba(255,107,118,.16);
  --rose: #ff3948;
  --gold: #e21b30;
  --gold-glow: rgba(226,27,48,.18);
  --text: #f4f2ef;
  --text-2: #b7b7bc;
  --text-3: #777;
  --border: #242626;
  --border-bright: rgba(255,255,255,.10);
  --radius: 10px;
  --radius-lg: 16px;
  --shadow: 0 20px 60px rgba(0,0,0,.36);
  --shadow-sm: 0 6px 18px rgba(0,0,0,.22);
  --font-display: 'Inter', Arial, sans-serif;
  --font-serif-body: 'Inter', Arial, sans-serif;
  --font-body: 'Inter', Arial, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --header-h: 60px;
  --bottom-nav-height: 72px;
  --tabbar-h: var(--bottom-nav-height);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{height:100%;font-size:16px;scroll-behavior:smooth;overscroll-behavior:none;overflow-x:hidden;}
body{
  font-family:var(--font-body);
  background:var(--ink);
  color:var(--text);
  min-height:100%;
  position:relative;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    linear-gradient(30deg,#fff 1px,transparent 1px),
    linear-gradient(150deg,#fff 1px,transparent 1px);
  background-size:90px 52px;
  mask-image:linear-gradient(90deg,black,transparent 65%);
  opacity:.035;
}
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 70% 45% at 50% -8%, rgba(226,27,48,.14), transparent 60%),
    radial-gradient(ellipse 120% 90% at 50% 110%, rgba(255,57,72,.08), transparent 55%);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}

/* HEADER */
.hd-header{
  position:sticky;top:0;z-index:20;height:var(--header-h);
  display:flex;align-items:center;gap:12px;padding:0 14px;
  background:linear-gradient(180deg, var(--ink-1), var(--ink));
  border-bottom:1px solid var(--border-bright);
  box-shadow:var(--shadow-sm);
}
.hd-back{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink-2);display:flex;align-items:center;justify-content:center;
  color:var(--text-2);flex-shrink:0;
}
.hd-titles{flex:1;min-width:0;}
.hd-title{font-family:var(--font-display);font-size:17px;font-weight:700;line-height:1.15;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.hd-sub{font-size:11px;color:var(--text-3);letter-spacing:.03em;}
.hd-search-btn{
  width:36px;height:36px;border-radius:50%;border:1px solid var(--border);
  background:var(--ink-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);
}


/* SEARCH BAR */
.search-bar{
  position:sticky;top:var(--header-h);z-index:19;
  background:var(--ink);border-bottom:1px solid var(--border);
  padding:10px 14px;display:none;gap:8px;
}
.search-bar.open{display:flex;}
.search-bar input{
  flex:1;background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:9px 12px;font-size:14px;color:var(--text);font-family:var(--font-body);
}
.search-bar input:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-glow);}

/* BREADCRUMB */
.crumb{
  padding:10px 14px 4px;font-size:12px;color:var(--text-3);display:flex;
  align-items:center;gap:6px;flex-wrap:wrap;
}
.crumb span.seg{cursor:pointer;color:var(--teal);}
.crumb span.seg:hover{text-decoration:underline;}
.crumb span.sep{color:var(--text-3);}
.crumb span.cur{color:var(--text-2);font-weight:600;}

/* MAIN */
main{position:relative;z-index:1;padding:10px 14px calc(var(--bottom-nav-height) + 24px + env(safe-area-inset-bottom, 0px));max-width:840px;margin:0 auto;}

/* BOOK LIST */
.book-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:12px;transition:transform .15s, box-shadow .15s;
}
.book-card:active{transform:scale(.985);}
.book-num{
  font-family:var(--font-display);font-size:20px;font-weight:900;color:var(--gold);
  width:38px;height:38px;border-radius:50%;border:1.5px solid var(--border-bright);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--ink-1);
}
.book-info{flex:1;min-width:0;}
.book-title{font-family:var(--font-serif-body);font-size:16.5px;font-weight:600;line-height:1.3;color:var(--text);}
.book-meta{font-size:11.5px;color:var(--text-3);margin-top:3px;font-family:var(--font-mono);}
.book-chev{color:var(--text-3);flex-shrink:0;}

/* CHAPTER LIST */
.chapter-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius);
  padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;
  box-shadow:var(--shadow-sm);
}
.chapter-card:active{transform:scale(.985);}
.chapter-num{
  font-family:var(--font-mono);font-size:12px;color:var(--text-3);
  width:28px;height:28px;border-radius:6px;background:var(--ink-1);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.chapter-info{flex:1;min-width:0;}
.chapter-title{font-family:var(--font-serif-body);font-size:15.5px;font-weight:600;line-height:1.3;}
.chapter-meta{font-size:11px;color:var(--text-3);margin-top:2px;}
.chapter-category{font-size:10px;color:var(--gold);text-transform:none;letter-spacing:.02em;margin-bottom:3px;font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

/* HADITH CARD */
.hadith-card{
  background:var(--ink-2);border:1px solid var(--border);border-radius:var(--radius-lg);
  padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);position:relative;
}
.hadith-card::before{
  content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;
  background:linear-gradient(180deg, var(--gold), var(--amber));border-radius:2px;
}
.hadith-num{
  font-family:var(--font-mono);font-size:11px;color:var(--gold);letter-spacing:.05em;
  font-weight:600;margin-bottom:6px;display:block;
}
.hadith-text{
  font-family:var(--font-serif-body);font-size:17px;line-height:1.6;color:var(--text);
  white-space:pre-line;word-wrap:break-word;overflow-wrap:break-word;
}
.hadith-grades{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;
}
.grade-chip{
  font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:6px;
  border:1px solid var(--border-bright);color:var(--text-2);background:var(--ink-1);
}
.grade-chip.grade-sahih{color:#4a7c4e;border-color:rgba(52,211,153,.25);background:rgba(52,211,153,.08);}
.grade-chip.grade-hasan{color:#c08a2e;border-color:rgba(251,191,36,.2);background:rgba(251,191,36,.06);}
.grade-chip.grade-other{color:var(--text-2);}
.hadith-missing{
  font-family:var(--font-mono);font-size:11.5px;color:var(--text-3);font-style:italic;
  margin-bottom:6px;
}

/* EMPTY / LOADING */
.state-msg{
  text-align:center;padding:60px 20px;color:var(--text-3);font-family:var(--font-serif-body);font-size:15px;
}
.spinner{
  width:28px;height:28px;border-radius:50%;border:3px solid var(--border);
  border-top-color:var(--gold);animation:spin 0.8s linear infinite;margin:0 auto 12px;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* SEARCH RESULTS */
.result-highlight{background:var(--gold-glow);color:var(--text);border-radius:2px;padding:0 1px;}
.result-path{font-size:11px;color:var(--text-3);margin-bottom:4px;font-family:var(--font-mono);}
.btn-action{
  padding:10px 14px;border-radius:10px;border:1px solid var(--border-bright);
  background:var(--ink-1);color:var(--gold);font-family:var(--font-body);font-size:13.5px;
  font-weight:600;cursor:pointer;
}
.btn-action:disabled{opacity:.55;cursor:default;}
.btn-action:active{transform:scale(.98);}
.btn-action-ghost{color:var(--text-2);}
/* Покрытие базы: честный статус поиска по загруженным книгам */
.coverage-box{
  background:var(--ink-1);border:1px solid var(--border);border-radius:var(--radius);
  padding:11px 13px;margin-bottom:14px;
}
.coverage-line{font-size:12px;color:var(--text-2);font-family:var(--font-mono);line-height:1.5;}
.coverage-warn{font-size:12px;color:var(--rose);margin-top:5px;line-height:1.5;word-break:break-word;}
.coverage-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px;}
.bulk-progress{margin-top:9px;}
.bulk-progress-track{
  height:5px;border-radius:3px;background:var(--ink-3);overflow:hidden;
}
.bulk-progress-bar{
  height:100%;width:0;background:linear-gradient(90deg, var(--gold), var(--amber));
  border-radius:3px;transition:width .2s ease;
}
.bulk-progress-text{font-size:11.5px;color:var(--text-3);margin-top:6px;font-family:var(--font-mono);}
/* Подсветка записи, к которой выполнен переход из поиска */
.hadith-target{outline:2px solid var(--gold);outline-offset:3px;}
@media (prefers-reduced-motion: reduce){
  .bulk-progress-bar{transition:none;}
  .hadith-target{outline-color:var(--gold);}
}

/* BOTTOM NAV (matches main site tab bar) */
.tab-bar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;height:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px));
  background:linear-gradient(180deg, var(--ink-1), var(--ink));
  border-top:1px solid var(--border-bright);box-shadow:0 -6px 20px rgba(58,40,16,.14);
  padding-bottom:env(safe-area-inset-bottom, 0px);
}
.tab-bar-inner{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));height:var(--bottom-nav-height);max-width:840px;margin:0 auto;}
.tab-btn{
  min-width:0;width:100%;height:var(--bottom-nav-height);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  background:none;border:none;color:var(--text-3);font-size:11px;font-family:var(--font-body);
}
.tab-btn.active{color:var(--gold);}
.tab-btn svg{width:26px;height:26px;stroke-width:1.8;transition:transform .2s;}
.tab-btn.active svg{transform:scale(1.1);filter:drop-shadow(0 0 5px rgba(226,27,48,.16));}

/* SCROLL TOP FAB */
.fab-top{
  position:fixed;right:16px;bottom:calc(var(--bottom-nav-height) + env(safe-area-inset-bottom, 0px) + 16px);z-index:25;
  width:42px;height:42px;border-radius:50%;background:var(--gold);color:#fff;border:none;
  box-shadow:var(--shadow);display:none;align-items:center;justify-content:center;
}
.fab-top.show{display:flex;}

</style>
</head>
<body>

<header class="hd-header">
  <button class="hd-back" id="backBtn" data-i18n-title="back" data-i18n-aria="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <div class="hd-titles">
    <div class="hd-title" id="hdTitle"></div>
    <div class="hd-sub" id="hdSub"></div>
  </div>

  <button class="hd-search-btn" id="searchToggle" data-i18n-title="search" data-i18n-aria="search">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
  </button>
</header>

<div class="search-bar" id="searchBar">
  <input type="text" id="searchInput" data-i18n-ph="searchPh" placeholder="" autocomplete="off">
</div>

<div class="crumb" id="crumb"></div>

<main id="mainArea">
  <div class="state-msg"><div class="spinner"></div><span data-i18n="loading"></span></div>
</main>

<button class="fab-top" id="fabTop" data-i18n-title="top">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 15l-6-6-6 6"/></svg>
</button>

<nav class="tab-bar">
  <div class="tab-bar-inner">
    <button class="tab-btn" id="navRijal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      <span data-i18n="tabRijal"></span>
    </button>
    <button class="tab-btn active" id="navHadis">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span data-i18n="tabHadis"></span>
    </button>
  </div>
</nav>


<script>
(function(){
  // База сайта: страница лежит в <base>/hadis/, поэтому корень — два уровня выше.
  // Работает и в корне домена, и в подпапке GitHub Pages.
  var BASE_URL = (function(){
    var p = location.pathname.replace(/\\/g,'/');
    var m = p.match(/^(.*\/)hadis(\/index\.html)?$/);
    return m ? m[1] : '/';
  })();
  // Локальная библиотека хадисов без ИИ и без серверных endpoint'ов.
  //
  // — booksIndex: лёгкий список книг с метаданными (hadis/books-index.json);
  // — bookCache: книги, реально загруженные по требованию (hadis/books/<id>.json),
  //   то есть при нажатии на конкретную книгу качается только она;
  // — bulk-загрузка всех книг запускается ТОЛЬКО по явному действию пользователя
  //   («Загрузить всю библиотеку» в результатах поиска) и показывает прогресс,
  //   отмену и повтор. Обычный просмотр книг её не запускает.
  var booksIndex = null;
  var bookCache = {};
  var chapterIndexCache = {};
  var chapterIndexLoadingPromises = {};
  var dataManifest = null;
  var dataManifestPromise = null;
  var bookLoadingPromises = {};
  // Статус каждой книги отдельно: 'idle' | 'loading' | 'ok' | 'failed'.
  // Флаг полной базы выставляется только когда ВСЕ книги индекса загружены.
  var bookStatus = {};
  var bookProgress = { done: 0, total: 0 };
  var bulkPromise = null;
  var retryPromise = null;
  var bulkCancelled = false;
  var bulkControllers = [];
  var allBooksLoaded = false;

  var BOOK_LOAD_CONCURRENCY = 3; // параллельные запросы при bulk-загрузке
  var BOOK_RETRIES = 2;          // дополнительные попытки на книгу в bulk-режиме

  // Плоский список хадисов пересобирается, когда набор загруженных книг меняется.
  var flatHadithCache = null;
  var flatHadithSignature = null;

  var UI = {
    ru: {
      back:'Назад', search:'Поиск', searchPh:'Поиск по хадисам…', loading:'Загрузка хадисов…',
      top:'Наверх', tabRijal:'Риджаль', tabHadis:'Хадисы',
      library:'Библиотека хадисов', allBooks:'Все книги', book:'Книга', chapter:'Глава', hadithWord:'ХАДИС',
      section:'раздел', results:'Результаты', booksFail:'Не удалось загрузить список книг.', bookFail:'Не удалось загрузить книгу.',
      loadingBook:'Загрузка книги…',
      nothing:'Ничего не найдено по запросу', inLocal:'в локальной библиотеке.',
      first300:'Показаны первые 300 из {n} результатов. Уточните запрос.',
      retryBook:'Повторить загрузку книги',
      searchCoverage:'Поиск выполнен по {loaded} из {total} книг ({hadiths} из {allHadiths} записей).',
      searchCoverageFull:'Поиск выполнен по всей библиотеке: {total} книг, {allHadiths} записей.',
      booksFailedWarn:'Недоступно книг: {n} ({ids}). Результаты могут быть неполными.',
      loadAllBtn:'Загрузить всю библиотеку ({books} книг, ~{mb} МБ)',
      cancelLoad:'Отменить',
      retryLoad:'Повторить загрузку ({n})',
      loadProgress:'Загрузка библиотеки: {done} из {total}',
      loadCancelled:'Загрузка прервана. Загружено книг: {n} из {total}.',
      loadFailedTotal:'Не удалось загрузить книги: {ids}.',
      showMore:'Показать ещё ({n})',
      offlineHint:'Нет соединения и книга не кэширована. Подключитесь к сети и повторите.',
      jumpTarget:'Найденная запись',
      noTranslation:'Русский перевод для этой записи отсутствует.',
      noText:'Текст записи недоступен.'
    }
  };
  function L(key){ return UI.ru[key]; }
  function Lf(key, map){
    return String(L(key)).replace(/\{(\w+)\}/g, function(_, k){ return map[k] !== undefined ? map[k] : ''; });
  }

  var WORDS = { hadith: ['хадис','хадиса','хадисов'], book: ['книга','книги','книг'], chapter: ['глава','главы','глав'] };
  function plural(n, kind){
    var w = WORDS[kind];
    var mod10 = n % 10, mod100 = n % 100;
    if (mod10 === 1 && mod100 !== 11) return w[0];
    if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return w[1];
    return w[2];
  }
  function bookTitle(b){
    if (!b) return '';
    var meta = (booksIndex || []).filter(function(m){ return m.id === b.id; })[0] || b;
    return meta.title || b.title || '';
  }

  var state = { view: 'books', bookId: null, chapterN: null, query: '', targetHadithId: null };

  var mainArea = document.getElementById('mainArea');
  var crumbEl = document.getElementById('crumb');
  var hdTitle = document.getElementById('hdTitle');
  var hdSub = document.getElementById('hdSub');

  function applyStaticI18n(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = L(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.setAttribute('placeholder', L(el.getAttribute('data-i18n-ph'))); });
    document.querySelectorAll('[data-i18n-title]').forEach(function(el){ el.setAttribute('title', L(el.getAttribute('data-i18n-title'))); });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', L(el.getAttribute('data-i18n-aria'))); });

    document.title = 'Библиотека хадисов | ShiaIsnad';
    var md = document.getElementById('pageDescription');
    if (md) md.setAttribute('content', 'Библиотека хадисов — Аль-Кафи и другие шиитские источники');
  }

  function esc(s){
    return String(s === null || s === undefined ? '' : s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  // Манифест общий для всех данных: он задаёт версию и пути индексов.
  // На первом экране загружается только манифест и лёгкий список книг.
  function libraryManifestUrl(){ return new URL(BASE_URL + 'data/index.json', location.origin); }
  function resolveManifestResource(key, fallback, id){
    var relative = (dataManifest && dataManifest[key]) || fallback;
    if (id !== undefined) relative = String(relative).replace(/\{id\}/g, String(id));
    return new URL(relative, libraryManifestUrl()).href;
  }
  function versionedLibraryUrl(url){
    var target = new URL(url, location.href);
    if (dataManifest && dataManifest.dataVersion && target.origin === location.origin && /\.json$/i.test(target.pathname)) {
      target.searchParams.set('v', dataManifest.dataVersion);
    }
    return target.href;
  }
  function loadLibraryManifest(){
    if (dataManifest) return Promise.resolve(dataManifest);
    if (dataManifestPromise) return dataManifestPromise;
    dataManifestPromise = fetch(libraryManifestUrl().href).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(json){
      if (!json || !json.dataVersion || !json.books || !json.hadithBookPattern || !json.chapterIndexes) {
        throw new Error('data/index.json is invalid or outdated');
      }
      dataManifest = json;
      return json;
    }).finally(function(){ dataManifestPromise = null; });
    return dataManifestPromise;
  }

  // booksIndexReadyPromise разрешается, когда загружен лёгкий список книг
  // (без текстов хадисов) — этого достаточно для показа библиотеки.
  var booksIndexReadyPromise = loadLibraryManifest().then(function(manifest){
    return fetch(versionedLibraryUrl(resolveManifestResource('books', '../hadis/books-index.json')));
  }).then(function(r){
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  }).then(function(json){
    if (!Array.isArray(json)) throw new Error('books-index.json is invalid');
    booksIndex = json;
    render();
  }).catch(function(err){
    var box = document.createElement('div');
    box.className = 'state-msg';
    box.textContent = L('booksFail') + (err && err.message ? ' (' + err.message + ')' : '');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-action';
    btn.textContent = L('retryBook');
    btn.addEventListener('click', function(){ location.reload(); });
    box.appendChild(document.createElement('br'));
    box.appendChild(btn);
    mainArea.innerHTML = '';
    mainArea.appendChild(box);
  });

  function bookUrl(id){
    return versionedLibraryUrl(resolveManifestResource('hadithBookPattern', '../hadis/books/{id}.json', id));
  }

  function requestBook(id, signal){
    return fetch(bookUrl(id), { signal: signal }).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    });
  }

  function invalidateFlat(){ flatHadithCache = null; flatHadithSignature = null; }

  // Загружает ОДНУ книгу. Повторный вызов для той же книги возвращает тот же
  // промис (нет дублирующих одновременных запросов к одному файлу).
  function fetchBook(id, tries, signal){
    if (bookCache[id]) return Promise.resolve(bookCache[id]);
    if (bookLoadingPromises[id]) return bookLoadingPromises[id];
    bookStatus[id] = 'loading';
    var max = Math.max(1, tries || 1);
    var attempt = 0;
    var run = function(){
      attempt++;
      return requestBook(id, signal).catch(function(err){
        if (err && err.name === 'AbortError') throw err;
        if (attempt < max) {
          return new Promise(function(res){ setTimeout(res, 400 * attempt); }).then(run);
        }
        throw err;
      });
    };
    var promise = run().then(function(book){
      bookCache[id] = book;
      bookStatus[id] = 'ok';
      delete bookLoadingPromises[id];
      invalidateFlat();
      return book;
    }, function(err){
      if (err && err.name === 'AbortError') {
        // Отменённая загрузка — не сбой: книга возвращается в 'idle', чтобы
        // её можно было дозагрузить повтором. Иначе она навсегда осталась бы
        // в 'loading', и база никогда не достигла бы полного покрытия.
        bookStatus[id] = 'idle';
      } else {
        bookStatus[id] = 'failed';
      }
      delete bookLoadingPromises[id];
      throw err;
    });
    bookLoadingPromises[id] = promise;
    return promise;
  }

  // Открывает книгу: если уже в кэше — сразу колбэк, иначе показывает
  // спиннер, качает только эту книгу и затем вызывает колбэк (обычно render).
  // Обычный просмотр книги НЕ запускает загрузку остальных книг.
  function requestChapterIndex(id){
    if (chapterIndexCache[id]) return Promise.resolve(chapterIndexCache[id]);
    if (chapterIndexLoadingPromises[id]) return chapterIndexLoadingPromises[id];
    var url = versionedLibraryUrl(resolveManifestResource('chapterIndexes', '../hadis/chapters-index/{id}.json', id));
    var promise = fetch(url).then(function(r){
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(json){
      if (!json || Number(json.bookId) !== Number(id) || !Array.isArray(json.chapters)) {
        throw new Error('chapter index is invalid for book ' + id);
      }
      chapterIndexCache[id] = json;
      return json;
    }).finally(function(){ delete chapterIndexLoadingPromises[id]; });
    chapterIndexLoadingPromises[id] = promise;
    return promise;
  }

  function makeChapterIndexFromBook(book){
    return {
      bookId: book.id,
      chaptersCount: (book.chapters || []).length,
      chapters: (book.chapters || []).map(function(ch){
        return { n: ch.n, category: ch.category || '', name: ch.name || '', hadithCount: (ch.h || []).length };
      })
    };
  }

  // Открытие книги загружает только её собственные данные и индекс глав.
  // Ошибка производного индекса не блокирует чтение: его можно восстановить
  // из уже загруженного полного файла книги без изменения исходных данных.
  function openBookOverview(id, cb){
    openBook(id, function(){
      if (chapterIndexCache[id]) { cb(); return; }
      requestChapterIndex(id).then(cb).catch(function(err){
        var cachedBook = getBook(id);
        if (cachedBook) {
          chapterIndexCache[id] = makeChapterIndexFromBook(cachedBook);
          console.warn('Chapter index unavailable; reconstructed from book', id, err && err.message);
          cb();
          return;
        }
        var box = document.createElement('div');
        box.className = 'state-msg';
        box.textContent = 'Не удалось загрузить индекс глав книги ' + id + '. ' + (err && err.message ? err.message : '');
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'btn-action';
        btn.textContent = L('retryBook');
        btn.addEventListener('click', function(){ openBookOverview(id, cb); });
        box.appendChild(document.createElement('br'));
        box.appendChild(btn);
        mainArea.innerHTML = '';
        mainArea.appendChild(box);
      });
    });
  }

  function openBook(id, cb){
    if (bookCache[id]) { cb(); return; }
    mainArea.innerHTML = '<div class="state-msg"><div class="spinner"></div>' + esc(L('loadingBook')) + '</div>';
    fetchBook(id, BOOK_RETRIES).then(function(){ cb(); }).catch(function(err){
      bookStatus[id] = 'failed';
      var box = document.createElement('div');
      box.className = 'state-msg';
      box.textContent = L('bookFail') + (err && err.message ? ' (' + err.message + ')' : '') + ' ' + L('offlineHint');
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-action';
      btn.textContent = L('retryBook');
      btn.addEventListener('click', function(){ openBook(id, cb); });
      box.appendChild(document.createElement('br'));
      box.appendChild(btn);
      mainArea.innerHTML = '';
      mainArea.appendChild(box);
    });
  }

  // «Недоступные» — только те книги, загрузка которых реально завершилась
  // ошибкой. Ещё не запрошенные книги остаются 'idle' и считаются ожидающими,
  // иначе частичная загрузка выглядела бы как сбой всей библиотеки.
  function failedBookIds(){
    return (booksIndex || []).filter(function(b){ return bookStatus[b.id] === 'failed'; }).map(function(b){ return b.id; });
  }
  function pendingBookIds(){
    return (booksIndex || []).filter(function(b){
      return !bookCache[b.id] && bookStatus[b.id] !== 'failed' && bookStatus[b.id] !== 'loading';
    }).map(function(b){ return b.id; });
  }
  function missingBookIds(){
    return (booksIndex || []).filter(function(b){ return !bookCache[b.id]; }).map(function(b){ return b.id; });
  }
  function loadedBookIds(){
    return (booksIndex || []).filter(function(b){ return !!bookCache[b.id]; }).map(function(b){ return b.id; });
  }
  function loadedHadithCount(){
    var n = 0;
    (booksIndex || []).forEach(function(b){ if (bookCache[b.id]) n += b.hadithCount || 0; });
    return n;
  }
  function totalHadithCount(){
    return (booksIndex || []).reduce(function(s, b){ return s + (b.hadithCount || 0); }, 0);
  }

  // Прогресс bulk-загрузки пишется в существующий на странице элемент,
  // поэтому перерисовка не сбрасывает его и не создаёт лишнего DOM.
  function updateProgress(){
    var el = document.getElementById('bulkProgressText');
    var bar = document.getElementById('bulkProgressBar');
    var total = bookProgress.total, done = bookProgress.done;
    if (el) {
      el.textContent = Lf('loadProgress', { done: done, total: total });
      var failed = failedBookIds().length;
      if (failed) el.textContent += ' · ' + Lf('booksFailedWarn', { n: failed, ids: failedBookIds().join(', ') });
    }
    if (bar) {
      bar.style.width = (total ? Math.round(done * 100 / total) : 0) + '%';
      bar.setAttribute('aria-valuenow', total ? Math.round(done * 100 / total) : 0);
    }
  }

  function cancelBulkLoad(){
    bulkCancelled = true;
    bulkControllers.forEach(function(c){ try { c.abort(); } catch (e) {} });
    bulkControllers = [];
  }

  // Bulk-загрузка всех книг. Возвращает сводку и НИКОГДА не выдаёт частичную
  // загрузку за полную: allBooksLoaded = true только если загружены все книги.
  function loadAllBooks(){
    // Флаг сверяется с фактическим содержимым кэша: если какая-то книга
    // исчезла из памяти, полная загрузка запускается заново, а не отдаёт
    // устаревшее «всё загружено».
    if (allBooksLoaded && missingBookIds().length === 0) {
      return Promise.resolve({ failed: [], allBooksLoaded: true, cancelled: false });
    }
    allBooksLoaded = false;
    if (bulkPromise) return bulkPromise;
    if (retryPromise) return retryPromise;
    bulkCancelled = false;
    bulkPromise = booksIndexReadyPromise.then(function(){
      if (!Array.isArray(booksIndex) || !booksIndex.length) throw new Error('Индекс книг не загружен');
      var ids = missingBookIds().filter(function(id){ return bookStatus[id] !== 'loading'; });
      bookProgress = { done: 0, total: ids.length };
      updateProgress();
      var next = 0;
      function step(){
        if (bulkCancelled) return Promise.resolve();
        if (next >= ids.length) return Promise.resolve();
        var id = ids[next++];
        var ctl = ('AbortController' in window) ? new AbortController() : null;
        if (ctl) bulkControllers.push(ctl);
        return fetchBook(id, 1 + BOOK_RETRIES, ctl ? ctl.signal : undefined)
          .then(function(){}, function(){ /* статус 'failed' уже записан; очередь продолжается */ })
          .then(function(){
            bookProgress.done++;
            updateProgress();
            return step();
          });
      }
      var workers = [];
      var n = Math.min(BOOK_LOAD_CONCURRENCY, ids.length);
      for (var k = 0; k < n; k++) workers.push(step());
      return Promise.all(workers);
    }).then(function(){
      bulkControllers = [];
      var failed = failedBookIds();
      // Полной база считается только если НЕ ОСТАЛОСЬ незагруженных книг.
      allBooksLoaded = missingBookIds().length === 0;
      bulkPromise = null;
      return { failed: failed, allBooksLoaded: allBooksLoaded, cancelled: bulkCancelled };
    }, function(err){
      bulkControllers = [];
      bulkPromise = null;
      allBooksLoaded = false;
      return { failed: failedBookIds(), allBooksLoaded: false, cancelled: bulkCancelled, error: err && err.message };
    });
    return bulkPromise;
  }

  // Повтор только для книг, которые не загрузились (или ещё не были запрошены).
  // Один общий промис на все параллельные вызовы: повторный клик по «Повторить»
  // не плодит дублирующие запросы к тому же файлу и возвращает реальный итог.
  function retryFailedBooks(){
    if (retryPromise) return retryPromise;
    var ids = failedBookIds().concat(pendingBookIds());
    if (!ids.length) return Promise.resolve({ failed: [], allBooksLoaded: allBooksLoaded, cancelled: false });
    allBooksLoaded = false;
    bulkCancelled = false;
    bookProgress = { done: 0, total: ids.length };
    updateProgress();
    var next = 0;
    function step(){
      if (bulkCancelled) return Promise.resolve();
      if (next >= ids.length) return Promise.resolve();
      var id = ids[next++];
      bookStatus[id] = 'idle';
      var ctl = ('AbortController' in window) ? new AbortController() : null;
      if (ctl) bulkControllers.push(ctl);
      return fetchBook(id, 1 + BOOK_RETRIES, ctl ? ctl.signal : undefined)
        .then(function(){}, function(){})
        .then(function(){ bookProgress.done++; updateProgress(); return step(); });
    }
    var workers = [];
    var n = Math.min(BOOK_LOAD_CONCURRENCY, ids.length);
    for (var k = 0; k < n; k++) workers.push(step());
    retryPromise = Promise.all(workers).then(function(){
      bulkControllers = [];
      var failed = failedBookIds();
      allBooksLoaded = missingBookIds().length === 0;
      retryPromise = null;
      return { failed: failed, allBooksLoaded: allBooksLoaded, cancelled: bulkCancelled };
    }, function(err){
      bulkControllers = [];
      retryPromise = null;
      allBooksLoaded = false;
      return { failed: failedBookIds(), allBooksLoaded: false, cancelled: bulkCancelled, error: err && err.message };
    });
    return retryPromise;
  }

  // ── Нормализация текста для локального поиска ──────────────────
  // Нормализует русскоязычные запросы по хадисному тексту.
  function normalizeSearchText(s){
    if (!s) return '';
    return String(s)
      .toLowerCase()
      .replace(/ё/g, 'е');
  }

  function searchWords(query){
    return normalizeSearchText(query).split(/[^a-zа-яё0-9]+/i).filter(function(w){ return w.length >= 2; });
  }

  // Подсвечивает ВСЕ найденные слова запроса, а не только первое вхождение
  // целиком: иначе поиск «плохо искал» при запросе из нескольких слов.
  function highlight(text, q){
    var words = searchWords(q);
    if (!words.length) return esc(text);
    var escaped = words
      .slice()
      .sort(function(a, b){ return b.length - a.length; })
      .map(function(w){ return w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); });
    var re = new RegExp('(' + escaped.join('|') + ')', 'gi');
    return esc(text).replace(re, function(m){ return '<mark class="result-highlight">' + m + '</mark>'; });
  }

  function setCrumb(parts){
    crumbEl.innerHTML = '';
    parts.forEach(function(p, i){
      if (i) {
        var sep = document.createElement('span');
        sep.className = 'sep';
        sep.textContent = '›';
        crumbEl.appendChild(sep);
      }
      var el = document.createElement('span');
      if (i === parts.length - 1) {
        el.className = 'cur';
        el.textContent = p.label;
      } else {
        el.className = 'seg';
        el.textContent = p.label;
        el.addEventListener('click', function(){
          if (p.action === 'books') { state.view='books'; state.bookId=null; state.chapterN=null; }
          else if (p.action === 'chapters') { state.view='chapters'; state.chapterN=null; }
          state.query = '';
          var si = document.getElementById('searchInput');
          if (si) si.value = '';
          render();
        });
      }
      crumbEl.appendChild(el);
    });
  }

  // Плоский список хадисов по ЗАГРУЖЕННЫМ книгам. Пересобирается только когда
  // набор загруженных книг изменился (подпись = id загруженных книг).
  function getFlatHadith(){
    var sig = loadedBookIds().join(',');
    if (flatHadithCache && flatHadithSignature === sig) return flatHadithCache;
    var flat = [];
    (booksIndex || []).forEach(function(meta){
      var book = bookCache[meta.id];
      if (!book) return;
      (book.chapters || []).forEach(function(ch){
        (ch.h || []).forEach(function(h){
          // В поиске участвует доступный русскоязычный текст хадиса.
          if (!h || !(h.text || h.russianText)) return;
          var item = {
            bookId: book.id,
            bookTitle: bookTitle(meta),
            chapterN: ch.n,
            chapterName: ch.name || '',
            category: ch.category || '',
            hadithId: h.id,
            text: h.text || h.russianText || ''
          };
          // Нормализованный текст строится один раз на загруженном наборе книг.
          item._blob = normalizeSearchText(
            item.text + ' ' + item.bookTitle + ' ' + item.chapterName
          );
          flat.push(item);
        });
      });
    });
    flatHadithCache = flat;
    flatHadithSignature = sig;
    return flat;
  }

  function searchLocalHadith(query){
    var words = searchWords(query);
    if (!words.length) return [];
    var scored = [];
    getFlatHadith().forEach(function(item){
      var hay = item._blob;
      var score = 0;
      for (var i = 0; i < words.length; i++) if (hay.indexOf(words[i]) !== -1) score++;
      if (score > 0) scored.push({ item: item, score: score });
    });
    scored.sort(function(a, b){
      return (b.score - a.score) || (a.item.bookId - b.item.bookId) ||
        (a.item.chapterN - b.item.chapterN) || ((a.item.hadithId || 0) - (b.item.hadithId || 0));
    });
    return scored.map(function(s){ return s.item; });
  }

  function render(){
    if (!booksIndex) return;
    window.scrollTo({top:0, behavior:'instant' in window ? 'instant' : 'auto'});
    document.getElementById('navHadis').classList.add('active');
    if (state.query) return renderSearch();
    if (state.view === 'books') return renderBooks();
    if (state.view === 'chapters') return renderChapters();
    if (state.view === 'hadiths') return renderHadiths();
  }

  function renderBooks(){
    var totalBooks = booksIndex.length;
    var totalH = totalHadithCount();
    hdTitle.textContent = L('library');
    hdSub.textContent = totalH + ' ' + plural(totalH,'hadith') + ' · ' + totalBooks + ' ' + plural(totalBooks,'book');
    setCrumb([{label:L('allBooks')}]);
    var html = '';
    booksIndex.forEach(function(book){
      html += '<div class="book-card" data-book="' + book.id + '" role="button" tabindex="0">' +
        '<div class="book-num">' + book.id + '</div>' +
        '<div class="book-info"><div class="book-title" dir="auto">' + esc(bookTitle(book)) + '</div>' +
        '<div class="book-meta">' + book.chaptersCount + ' ' + plural(book.chaptersCount,'chapter') + ' · ' + book.hadithCount + ' ' + plural(book.hadithCount,'hadith') + '</div></div>' +
        '<div class="book-chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>' +
      '</div>';
    });
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.book-card').forEach(function(el){
      var go = function(){
        var id = parseInt(el.getAttribute('data-book'), 10);
        state.bookId = id;
        state.view = 'chapters';
        openBookOverview(id, render);
      };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });
  }

  function getBook(id){ return bookCache[id]; }

  function renderChapters(){
    var meta = (booksIndex || []).filter(function(item){ return item.id === state.bookId; })[0];
    var chapterIndex = chapterIndexCache[state.bookId];
    if (!meta || !chapterIndex) { state.view = 'books'; return render(); }
    var titleLine = bookTitle(meta);
    hdTitle.textContent = L('book') + ' ' + meta.id;
    hdSub.textContent = titleLine;
    setCrumb([{label:L('allBooks'), action:'books'}, {label:L('book') + ' ' + meta.id}]);
    var html = '<div dir="auto" style="font-family:var(--font-display);font-size:18px;font-weight:700;margin:4px 0 14px;line-height:1.3;">' + esc(titleLine) + '</div>';
    chapterIndex.chapters.forEach(function(ch){
      var name = ch.name || (L('chapter') + ' ' + ch.n);
      var cat = ch.category || '';
      var count = Number(ch.hadithCount) || 0;
      html += '<div class="chapter-card" data-ch="' + ch.n + '" role="button" tabindex="0">' +
        '<div class="chapter-num">' + ch.n + '</div>' +
        '<div class="chapter-info">' +
        (cat ? '<div class="chapter-category" dir="auto">' + esc(cat) + '</div>' : '') +
        '<div class="chapter-title" dir="auto">' + esc(name) + '</div>' +
        '<div class="chapter-meta">' + count + ' ' + plural(count,'hadith') + '</div></div>' +
      '</div>';
    });
    mainArea.innerHTML = html;
    mainArea.querySelectorAll('.chapter-card').forEach(function(el){
      var go = function(){
        state.chapterN = parseInt(el.getAttribute('data-ch'), 10);
        state.view = 'hadiths';
        state.targetHadithId = null;
        render();
      };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });
  }

  // Порционная отрисовка главы: по PAGE_SIZE записей, «Показать ещё» добавляет
  // следующую порцию без пересоздания уже показанных карточек и без сброса
  // прокрутки. Номера хадисов берутся из данных (h.id), а не из позиции.
  var PAGE_SIZE = 100;

  function hadithCardHtml(h, fallbackNum){
    var sourceNo = (h && h.id !== undefined && h.id !== null) ? h.id : fallbackNum;
    var html = '<div class="hadith-card" data-hadith="' + esc(sourceNo) + '">' +
      '<span class="hadith-num">' + esc(L('hadithWord')) + ' №' + esc(sourceNo) + '</span>';

    // Оценки достоверности (маджлиси и выбранный уровень), если они есть.
    var grades = [];
    var mg = h && h.majlisiGrading;
    var sg = h && h.selectedGrade;
    if (mg && String(mg).trim()) grades.push({ label: String(mg), cls: gradeClass(mg, sg) });
    else if (sg && String(sg).trim()) grades.push({ label: String(sg), cls: gradeClass(null, sg) });
    if (grades.length) {
      html += '<div class="hadith-grades">';
      grades.forEach(function(g){
        html += '<span class="grade-chip ' + g.cls + '" dir="auto">' + esc(g.label) + '</span>';
      });
      html += '</div>';
    }

    // Хадисная страница использует только русскоязычный текст.
    var ru = String((h && h.text) || (h && h.russianText) || '').trim();
    if (ru) {
      html += '<div class="hadith-text" lang="ru" dir="ltr">' + esc(ru) + '</div>';
    } else {
      html += '<div class="hadith-missing">' + esc(L('noText')) + '</div>';
    }
    html += '</div>';
    return html;
  }

  // CSS-класс плашки оценки по содержимому поля.
  function gradeClass(majlisi, selected){
    var s = String(selected || '') + ' ' + String(majlisi || '');
    if (/sahih/i.test(s)) return 'grade-sahih';
    if (/hasan/i.test(s)) return 'grade-hasan';
    return 'grade-other';
  }

  function renderHadiths(){
    var book = getBook(state.bookId);
    if (!book) { state.view = 'books'; return render(); }
    var ch = null;
    (book.chapters || []).forEach(function(c){ if (c.n === state.chapterN) ch = c; });
    if (!ch) { state.view = 'chapters'; return render(); }
    var items = ch.h || [];
    hdTitle.textContent = L('chapter') + ' ' + ch.n;
    hdSub.textContent = bookTitle(book);
    setCrumb([
      {label:L('allBooks'), action:'books'},
      {label:L('book') + ' ' + book.id, action:'chapters'},
      {label:L('chapter') + ' ' + ch.n}
    ]);

    // Переход из поиска: показываем столько порций, сколько нужно, чтобы
    // найденная запись реально появилась на странице.
    var targetIdx = -1;
    if (state.targetHadithId !== null) {
      for (var ti = 0; ti < items.length; ti++) {
        if (items[ti] && items[ti].id === state.targetHadithId) { targetIdx = ti; break; }
      }
    }
    var initial = PAGE_SIZE;
    if (targetIdx >= 0) initial = Math.min(items.length, Math.max(PAGE_SIZE, (Math.floor(targetIdx / PAGE_SIZE) + 1) * PAGE_SIZE));

    var html = '<div style="margin:4px 0 14px;">' +
      (ch.category ? '<div class="chapter-category" dir="auto" style="margin-bottom:4px;">' + esc(ch.category) + '</div>' : '') +
      '<div dir="auto" style="font-family:var(--font-serif-body);font-size:16px;font-weight:600;color:var(--text-2);">' + esc(ch.name || '') + '</div></div>';
    html += '<div id="hadithList">';
    for (var i = 0; i < Math.min(initial, items.length); i++) html += hadithCardHtml(items[i], i + 1);
    html += '</div>';
    html += '<div id="hadithMoreWrap"></div>';
    mainArea.innerHTML = html;

    var listEl = document.getElementById('hadithList');
    var moreWrap = document.getElementById('hadithMoreWrap');

    function renderMoreButton(){
      var shown = listEl.querySelectorAll('.hadith-card').length;
      moreWrap.innerHTML = '';
      if (shown >= items.length) return;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'btn-action';
      btn.id = 'loadMoreHadiths';
      btn.textContent = Lf('showMore', { n: items.length - shown });
      btn.addEventListener('click', function(){
        // «Показать ещё» добавляет только ещё не показанные записи — без
        // дублей и без перерисовки списка, поэтому прокрутка не сбрасывается.
        var from = listEl.querySelectorAll('.hadith-card').length;
        var end = Math.min(from + PAGE_SIZE, items.length);
        var frag = document.createDocumentFragment();
        var holder = document.createElement('div');
        var part = '';
        for (var j = from; j < end; j++) part += hadithCardHtml(items[j], j + 1);
        holder.innerHTML = part;
        while (holder.firstChild) frag.appendChild(holder.firstChild);
        listEl.appendChild(frag);
        renderMoreButton();
      });
      moreWrap.appendChild(btn);
    }
    renderMoreButton();

    // Прокрутка к найденной записи — после того, как её карточка в DOM.
    if (targetIdx >= 0) {
      state.targetHadithId = null;
      var card = listEl.querySelector('.hadith-card[data-hadith="' + CSS.escape(String(items[targetIdx].id)) + '"]');
      if (!card) card = listEl.querySelectorAll('.hadith-card')[targetIdx];
      if (card) {
        card.classList.add('hadith-target');
        requestAnimationFrame(function(){
          card.scrollIntoView({ block: 'center', behavior: 'smooth' });
        });
      }
    }
  }

  // Панель покрытия базы: честный статус (сколько книг/записей участвовало в
  // поиске), прогресс, отмена и повтор. Никогда не выдаёт частичный поиск
  // за полный.
  function renderCoveragePanel(container){
    var loaded = loadedBookIds().length;
    var total = (booksIndex || []).length;
    var failed = failedBookIds();
    var lh = loadedHadithCount(), th = totalHadithCount();

    var box = document.createElement('div');
    box.className = 'coverage-box';
    box.setAttribute('role', 'status');
    box.setAttribute('aria-live', 'polite');

    var line = document.createElement('div');
    line.className = 'coverage-line';
    line.textContent = allBooksLoaded
      ? Lf('searchCoverageFull', { total: total, allHadiths: th })
      : Lf('searchCoverage', { loaded: loaded, total: total, hadiths: lh, allHadiths: th });
    box.appendChild(line);

    if (failed.length) {
      var warn = document.createElement('div');
      warn.className = 'coverage-warn';
      warn.textContent = Lf('booksFailedWarn', { n: failed.length, ids: failed.join(', ') });
      box.appendChild(warn);
    }

    var actions = document.createElement('div');
    actions.className = 'coverage-actions';

    if (!allBooksLoaded) {
      if (failed.length) {
        // Есть реальные сбои загрузки — сначала повторить именно их.
        var retry = document.createElement('button');
        retry.type = 'button';
        retry.className = 'btn-action';
        retry.textContent = Lf('retryLoad', { n: failed.length });
        retry.addEventListener('click', function(){
          if (retryPromise) return;
          actions.innerHTML = '';
          var prog = document.createElement('div');
          prog.className = 'bulk-progress';
          prog.innerHTML = '<div class="bulk-progress-track"><div class="bulk-progress-bar" id="bulkProgressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width:0%"></div></div><div class="bulk-progress-text" id="bulkProgressText"></div>';
          actions.appendChild(prog);
          retryFailedBooks().then(function(){ if (state.query) render(); });
        });
        actions.appendChild(retry);
      } else {
        var pending = total - loaded;
        var mb = estimatePendingMb();
        var load = document.createElement('button');
        load.type = 'button';
        load.className = 'btn-action';
        load.textContent = Lf('loadAllBtn', { books: pending, mb: mb });
        load.addEventListener('click', function(){ startBulkWithUi(box); });
        actions.appendChild(load);
      }
    }
    if (actions.childNodes.length) box.appendChild(actions);
    container.appendChild(box);
  }

  function estimatePendingMb(){
    // Оценка по фактическим hadithCount недоступных книг (средний размер записи
    // по загруженным книгам), чтобы не обещать пользователю выдуманную цифру.
    var loaded = loadedBookIds();
    var perHadith = 0;
    if (loaded.length) {
      var bytes = 0, hadiths = 0;
      (booksIndex || []).forEach(function(b){
        if (bookCache[b.id]) { bytes += JSON.stringify(bookCache[b.id]).length; hadiths += b.hadithCount || 0; }
      });
      perHadith = hadiths ? bytes / hadiths : 0;
    }
    if (!perHadith) perHadith = 1800; // запасная оценка ≈ средний размер записи
    var pending = missingBookIds().reduce(function(s, id){
      var meta = (booksIndex || []).filter(function(b){ return b.id === id; })[0];
      return s + ((meta && meta.hadithCount) || 0);
    }, 0);
    return Math.max(1, Math.round(pending * perHadith / 1048576 * 10) / 10);
  }

  function startBulkWithUi(box){
    var actions = box.querySelector('.coverage-actions');
    if (actions) actions.innerHTML = '';
    var prog = document.createElement('div');
    prog.className = 'bulk-progress';
    prog.innerHTML = '<div class="bulk-progress-track"><div class="bulk-progress-bar" id="bulkProgressBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" style="width:0%"></div></div><div class="bulk-progress-text" id="bulkProgressText"></div>';
    box.appendChild(prog);
    var cancelWrap = document.createElement('div');
    cancelWrap.className = 'coverage-actions';
    var cancelBtn = document.createElement('button');
    cancelBtn.type = 'button';
    cancelBtn.className = 'btn-action btn-action-ghost';
    cancelBtn.textContent = L('cancelLoad');
    cancelBtn.addEventListener('click', function(){ cancelBulkLoad(); });
    cancelWrap.appendChild(cancelBtn);
    box.appendChild(cancelWrap);
    updateProgress();

    loadAllBooks().then(function(res){
      if (res.cancelled) {
        var msg = document.createElement('div');
        msg.className = 'coverage-warn';
        msg.textContent = Lf('loadCancelled', { n: loadedBookIds().length, total: (booksIndex || []).length });
        box.appendChild(msg);
      }
      if (res.failed && res.failed.length && !res.cancelled) {
        var f = document.createElement('div');
        f.className = 'coverage-warn';
        f.textContent = Lf('loadFailedTotal', { ids: res.failed.join(', ') });
        box.appendChild(f);
      }
      if (state.query) render();
    });
  }

  function renderSearch(){
    hdTitle.textContent = L('search');
    hdSub.textContent = '«' + state.query + '»';
    setCrumb([{label:L('allBooks'), action:'books'}, {label:L('results')}]);

    // Поиск выполняется по исходному тексту запроса, машинный перевод не
    // используется. В поиске участвуют только реально загруженные книги,
    // и это честно показывается в панели покрытия ниже.
    var results = searchLocalHadith(state.query);
    var searchQ = state.query;

    mainArea.innerHTML = '';
    var coverageHost = document.createElement('div');
    mainArea.appendChild(coverageHost);
    renderCoveragePanel(coverageHost);

    if (!results.length) {
      var empty = document.createElement('div');
      empty.className = 'state-msg';
      empty.textContent = L('nothing') + ' «' + searchQ + '» ' + L('inLocal');
      mainArea.appendChild(empty);
      return;
    }

    var crumbResults = L('results') + ': ' + results.length;
    setCrumb([{label:L('allBooks'), action:'books'}, {label:crumbResults}]);

    var shown = results.slice(0, 300);
    var html = '';
    shown.forEach(function(it){
      var body = it.text && String(it.text).trim()
        ? '<div class="hadith-text" lang="ru" dir="ltr">' + highlight(it.text, searchQ) + '</div>'
        : '<div class="hadith-missing">' + esc(L('noTranslation')) + '</div>';
      html += '<div class="hadith-card" data-book="' + it.bookId + '" data-ch="' + it.chapterN + '" data-hadith="' + esc(it.hadithId) + '" role="button" tabindex="0" style="cursor:pointer;">' +
        '<div class="result-path" dir="auto">' + esc(it.bookTitle) + (it.category ? ' · ' + esc(it.category) : '') + ' · ' + esc(L('chapter')) + ' ' + esc(it.chapterN) + ' · №' + esc(it.hadithId) + '</div>' +
        body +
      '</div>';
    });
    var listHost = document.createElement('div');
    listHost.innerHTML = html;
    mainArea.appendChild(listHost);

    if (results.length > 300) {
      var more = document.createElement('div');
      more.className = 'state-msg';
      more.textContent = Lf('first300', { n: results.length });
      mainArea.appendChild(more);
    }

    mainArea.querySelectorAll('.hadith-card[data-book]').forEach(function(el){
      var go = function(){
        state.query = '';
        var si = document.getElementById('searchInput');
        if (si) si.value = '';
        document.getElementById('searchBar').classList.remove('open');
        state.bookId = parseInt(el.getAttribute('data-book'), 10);
        state.chapterN = parseInt(el.getAttribute('data-ch'), 10);
        var hid = el.getAttribute('data-hadith');
        state.targetHadithId = hid === null ? null : parseInt(hid, 10);
        state.view = 'hadiths';
        openBook(state.bookId, render);
      };
      el.addEventListener('click', go);
      el.addEventListener('keydown', function(e){
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); }
      });
    });
  }

  // Search bar toggle
  var searchBar = document.getElementById('searchBar');
  var searchInput = document.getElementById('searchInput');
  document.getElementById('searchToggle').addEventListener('click', function(){
    searchBar.classList.toggle('open');
    if (searchBar.classList.contains('open')) {
      searchInput.focus();
    }
  });
  var searchTimer;
  searchInput.addEventListener('input', function(){
    clearTimeout(searchTimer);
    var v = searchInput.value.trim();
    searchTimer = setTimeout(function(){
      state.query = v.length >= 2 ? v : '';
      state.targetHadithId = null;
      render();
    }, 250);
  });
  searchInput.addEventListener('keydown', function(e){
    if (e.key === 'Escape') {
      searchInput.value = '';
      state.query = '';
      searchBar.classList.remove('open');
      render();
    }
  });

  // Back button
  document.getElementById('backBtn').addEventListener('click', function(){
    if (state.query) { state.query=''; searchInput.value=''; searchBar.classList.remove('open'); return render(); }
    if (state.view === 'hadiths') { state.view = 'chapters'; state.chapterN=null; state.targetHadithId=null; return render(); }
    if (state.view === 'chapters') { state.view = 'books'; state.bookId=null; return render(); }
    window.location.href = BASE_URL + 'index.html';
  });

  // Bottom nav
  document.getElementById('navRijal').addEventListener('click', function(){ window.location.href = BASE_URL + 'index.html'; });
  document.getElementById('navHadis').addEventListener('click', function(){
    state.view='books'; state.bookId=null; state.chapterN=null; state.query=''; state.targetHadithId=null;
    searchInput.value='';
    render();
  });

  applyStaticI18n();

  // Scroll-to-top FAB
  var fab = document.getElementById('fabTop');
  window.addEventListener('scroll', function(){
    if (window.scrollY > 400) fab.classList.add('show'); else fab.classList.remove('show');
  }, { passive: true });
  fab.addEventListener('click', function(){ window.scrollTo({top:0, behavior:'smooth'}); });

  // Публичный (только для тестов) доступ к внутренней логике страницы.
  window.__hadisTest = {
    state: state,
    get booksIndex(){ return booksIndex; },
    bookCache: bookCache,
    bookStatus: bookStatus,
    get allBooksLoaded(){ return allBooksLoaded; },
    getFlatHadith: getFlatHadith,
    searchLocalHadith: searchLocalHadith,
    normalizeSearchText: normalizeSearchText,
    searchWords: searchWords,
    fetchBook: fetchBook,
    openBook: openBook,
    loadAllBooks: loadAllBooks,
    retryFailedBooks: retryFailedBooks,
    cancelBulkLoad: cancelBulkLoad,
    failedBookIds: failedBookIds,
    pendingBookIds: pendingBookIds,
    missingBookIds: missingBookIds,
    loadedBookIds: loadedBookIds,
    render: render,
    renderHadiths: renderHadiths,
    renderSearch: renderSearch,
    setQuery: function(q){ state.query = q; render(); }
  };
})();
</script>
</body>
</html>
