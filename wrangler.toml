name = "ilm-al-rijal"
main = "worker.js"
compatibility_date = "2025-01-01"

# Отдаёт index.html и любые другие статические файлы из ./public
[assets]
directory = "./public"
binding = "ASSETS"

# Секреты и реальные значения НЕ прописывайте здесь. После деплоя:
#   wrangler secret put AI_API_KEY
#   wrangler secret put AI_BASE_URL
#   wrangler secret put AI_MODEL
#   wrangler secret put TRANSLATE_MODEL_AI
# (все можно хранить как secrets, а не просто vars, если не хотите
# светить даже провайдера и модель в конфиге репозитория)
#
# TRANSLATE_MODEL_AI — отдельная модель специально для перевода интерфейса,
# карточек передатчиков и хадисов на азербайджанский (и другие) язык.
# Используется только запросами с заголовком X-Translate: 1.
# Если секрет не задан — воркер просто использует AI_MODEL и для перевода тоже.

# D1 database used by the mobile admin panel.
# Create a D1 database in the Cloudflare Dashboard and replace database_id.
[[d1_databases]]
binding = "DB"
database_name = "ilm-al-rijal"
database_id = "PUT_YOUR_D1_DATABASE_ID_HERE"
