name = "ilm-al-rijal"
main = "worker.js"
compatibility_date = "2025-01-01"

# Отдаёт index.html и любые другие статические файлы из ./public
[assets]
directory = "./public"
binding = "ASSETS"

# ---------------------------------------------------------------------------
# Админ-панель (/admin) — база данных Cloudflare D1
# ---------------------------------------------------------------------------
# 1) Создать базу:      wrangler d1 create ilm-al-rijal-db
#    Скопировать выданный database_id сюда вместо "REPLACE_WITH_YOUR_D1_DATABASE_ID".
# 2) Применить схему:   wrangler d1 execute ilm-al-rijal-db --remote --file=migrations/0001_init.sql
# 3) Задать секрет JWT: wrangler secret put JWT_SECRET   (любая длинная случайная строка)
# 4) Деплой:            wrangler deploy
# 5) Открыть /admin — при пустой таблице users будет предложено создать первого администратора.
[[d1_databases]]
binding = "DB"
database_name = "ilm-al-rijal-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Секреты и реальные значения НЕ прописывайте здесь. После деплоя:
#   wrangler secret put AI_API_KEY
#   wrangler secret put AI_BASE_URL
#   wrangler secret put AI_MODEL
#   wrangler secret put TRANSLATE_MODEL_AI
# (все можно хранить как secrets, а не просто vars, если не хотите
# светить даже провайдера и модель в конфиге репозитория)
#
# TRANSLATE_MODEL_AI — отдельная модель специально для перевода интерфейса,
# карточек передатчиков и хадисов на азербайджанский (и другие) язык.
# Используется только запросами с заголовком X-Translate: 1.
# Если секрет не задан — воркер просто использует AI_MODEL и для перевода тоже.
