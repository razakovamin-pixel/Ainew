
<!DOCTYPE html>
<html lang="ru" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.json">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" onerror="console.warn('Fonts blocked')">

<link rel="stylesheet" href="CSS/base-layout.css">
<link rel="stylesheet" href="CSS/search-list.css">
<link rel="stylesheet" href="CSS/rijal-details.css">
<link rel="stylesheet" href="CSS/components-navigation.css">
<link rel="stylesheet" href="CSS/feature-overrides.css">
<link rel="stylesheet" href="CSS/visual-effects.css">
<link rel="stylesheet" href="CSS/app-shell.css">

<script src="js/01-i18n.js" defer></script>
<script src="js/02-core-state-data.js" defer></script>

<script src="js/04-search.js" defer></script>
<script src="js/05-transmitter-list.js" defer></script>
<script src="js/06-transmitter-detail-events.js" defer></script>

</head>
<body class="app-intro">

<div class="body-ambient-layer" aria-hidden="true"></div>
<div class="bg-glow" aria-hidden="true"></div>

<div class="loading-overlay" id="loading" style="display:none;">
  <div class="loading-card">
    <div class="loading-emblem">ر</div>
    <div class="loading-title">جارٍ تحميل قاعدة بيانات الرجال</div>
    <div class="loading-subtitle">جارٍ تجهيز قائمة الرواة والواجهة</div>
    <div class="loading-skeleton" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <div class="loading-bar"></div>
  </div>
</div>

<header class="app-header">
  <button class="btn-menu" id="btnMenu" aria-label="Меню" data-i18n-aria="menuAria">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
      <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
    </svg>
  </button>
  <div class="header-left">
    <div class="app-emblem">ر</div>
    <div class="app-brand">
      <div class="app-title" id="appTitle">Ильм <span>ар-Риджаль</span></div>
      <div class="app-subtitle" id="appSubtitle">Сравнительный критический анализ передатчиков</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="btn-icon" id="btnSort" title="Сортировка списка">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="9" y2="18"/>
        <polyline points="17 15 21 19 17 23" transform="translate(0,-3)"/>
      </svg>
    </button>
  </div>
</header>

<nav class="tab-bar" id="tabBar" role="tablist">
  <div class="tab-bar-inner">
    <button class="tab-btn active" id="tabСписок" role="tab" aria-selected="true" aria-label="Передатчики">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
      <span id="tabСписокLabel">Передатчики</span>
    </button>
    <button class="tab-btn" id="tabDetail" role="tab" aria-selected="false" style="position:relative;" aria-label="Карточка">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="3"/><line x1="8" y1="9" x2="16" y2="9"/>
        <line x1="8" y1="13" x2="14" y2="13"/><line x1="8" y1="17" x2="12" y2="17"/>
      </svg>
      <span id="tabDetailLabel">Карточка</span>
    </button>
    <button class="tab-btn" id="btnHadis" title="Хадисы">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
      </svg>
      <span id="btnHadisLabel">Хадисы</span>
    </button>
    <button class="tab-btn tab-btn-articles" id="btnStatya" title="Статьи" aria-label="Статьи" data-i18n-aria="statyaLabel">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17.5A2.5 2.5 0 0 0 17.5 18H6.5A2.5 2.5 0 0 0 4 20.5z"/>
        <path d="M7 7h9M7 10.5h9M7 14h6"/>
      </svg>
      <span id="btnStatyaLabel">Статьи</span>
    </button>
  </div>
</nav>

<a class="articles-bottom-link" id="desktopArticlesLink" href="statya/" aria-label="Статьи" data-i18n-aria="statyaLabel">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v17.5A2.5 2.5 0 0 0 17.5 18H6.5A2.5 2.5 0 0 0 4 20.5z"/>
    <path d="M7 7h9M7 10.5h9M7 14h6"/>
  </svg>
  <span data-i18n="statyaLabel">Статьи</span>
</a>

<div class="app-body">
  <div class="drawer-overlay" id="drawerOverlay"></div>
  <aside class="sidebar tab-active" id="sidebar">
    <div class="sidebar-top">
      <div class="search-wrap" id="searchWrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="search" class="search-input" id="searchInput" autocomplete="off" autocorrect="off" spellcheck="false">
        <button class="search-clear" id="searchClear" aria-label="Очистить" data-i18n-aria="clearAria">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
        <span class="kbd-hint">Ctrl+K</span>
      </div>

      <div class="filter-bar" id="filterBar">
        <button class="filter-chip active" data-filter="all" id="filterВсе">—</button>
        <button class="filter-chip" data-filter="trust" id="filterTrust">—</button>
        <button class="filter-chip" data-filter="disputed" id="filterСпорный">—</button>
        <button class="filter-chip" data-filter="weak" id="filterСлабый">—</button>
        <button class="filter-chip" data-filter="unknown" id="filterUnknown">—</button>
      </div>

      <div class="filter-section-label" id="epochLabel">Эпоха</div>
      <div class="epoch-bar" id="epochBar">
        <button class="epoch-chip active" data-epoch="all">Все</button>
        <button class="epoch-chip" data-epoch="sahaba">Сахабы</button>
        <button class="epoch-chip" data-epoch="tabiin">Табиины</button>
        <button class="epoch-chip" data-epoch="2">II в.х.</button>
        <button class="epoch-chip" data-epoch="3">III в.х.</button>
        <button class="epoch-chip" data-epoch="4">IV в.х.</button>
        <button class="epoch-chip" data-epoch="5+">V+ в.х.</button>
      </div>

      <div class="filter-section-label" id="sectLabel">Течение</div>
      <div class="sect-bar" id="sectBar">
        <button class="sect-chip active" data-sect="all">Все</button>
        <button class="sect-chip" data-sect="imamit">Имамиты</button>
        <button class="sect-chip" data-sect="nasibi">Насибиты</button>
        <button class="sect-chip" data-sect="ghulat">Гулаты</button>
        <button class="sect-chip" data-sect="wakifi">Вакифиты</button>
        <button class="sect-chip" data-sect="zaydi">Зейдиты</button>
      </div>

      <div class="quick-actions">
        <button class="btn-quick" id="btnShowВсе">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
          <span id="allLabel">—</span>
        </button>
        <button class="btn-quick" id="btnShowFav" type="button" aria-pressed="false" data-i18n-title="favLabel" data-i18n-aria="favLabel">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
          <span id="favCountLabel" data-i18n="favLabel">—</span>
        </button>
      </div>
    </div>

    <div class="stats-bar">
      <span class="stats-count" id="statsCount"></span>
      <span class="deep-status" id="deepStatus" role="status" aria-live="polite" hidden></span>
      <button id="btnCollapseFilters" title="Скрыть/показать фильтры" style="background:none;border:none;color:var(--text-3);cursor:pointer;padding:4px 6px;border-radius:6px;display:flex;align-items:center;gap:4px;font-size:11px;font-family:var(--font-mono);transition:color .2s">
        <svg id="collapseIcon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="18 15 12 9 6 15"/>
        </svg>
        <span id="collapseLabel">Фильтры</span>
      </button>
    </div>

    <div class="transmitter-list" id="txListViewport" role="listbox" style="overflow-y:auto; position:relative;">
      <div id="txListTopSpacer" style="height:0px; flex-shrink:0;"></div>
      <ul id="txСписок" style="list-style:none; padding:8px; display:flex; flex-direction:column; gap:4px; margin:0;"></ul>
      <div id="txListBottomSpacer" style="height:0px; flex-shrink:0;"></div>
    </div>
  </aside>

  <main class="content" id="content">
    <button class="btn-back" id="btnНазад">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      <span id="backLabel">—</span>
    </button>

    <div class="welcome" id="welcome">
      <div class="welcome-emblem">ر</div>
      <h2 id="welcomeTitle">—</h2>
      <p id="welcomeDesc">—</p>
      <div class="welcome-stats">
        <div class="ws-item">
          <div class="ws-num" id="wsTotalNum">—</div>
          <div class="ws-label" id="wsTotalLabel">—</div>
        </div>
        <div class="ws-item">
          <div class="ws-num" id="wsTrustNum">—</div>
          <div class="ws-label" id="wsTrustLabel">—</div>
        </div>
      </div>
    </div>

    <div class="detail" id="detailView" style="display:none;">
      <div class="det-header">
        <div class="det-top">
          <button type="button" class="fav-toggle" id="detFavBtn" aria-pressed="false" data-i18n-title="favLabel" data-i18n-aria="favLabel">
            <span class="fav-star" aria-hidden="true">★</span>
          </button>
          <div class="det-names">
            <div class="det-name" id="detName"></div>
            <span class="det-arabic" id="detArabic"></span>
            <div class="det-id" id="detId"></div>
            <div class="det-score-badge" id="detScoreBadge" style="display:none">
              <span class="det-score-label" data-i18n="indexLabel">Индекс</span>
              <div class="det-score-bar"><div class="det-score-fill" id="detScoreFill"></div></div>
              <span class="det-score-val" id="detScoreVal"></span>
            </div>
          </div>
        </div>
      </div>

      <div class="status-grid">
        <div class="status-card">
          <div class="sc-label" id="scShiaLabel">—</div>
          <div class="sc-value" id="scShiaVal">
            <span class="sc-dot" id="scShiaDot"></span>
            <span id="scShiaText"></span>
          </div>
        </div>
        <div class="status-card">
          <div class="sc-label" id="scSunniLabel">—</div>
          <div class="sc-value" id="scSunniVal">
            <span class="sc-dot" id="scSunniDot"></span>
            <span id="scSunniText"></span>
          </div>
        </div>
      </div>

      <div class="section">
        <div class="sec-title" id="secBioLabel">—</div>
        <div class="bio-box" id="detBio"></div>
      </div>

      <div class="section" id="originalBioSection" style="display:none">
        <div class="sec-title" id="secOriginalBioLabel">—</div>
        <div class="bio-box bio-box-ar" id="detOriginalBio" lang="ar" dir="rtl"></div>
      </div>

      <div class="section" id="analysisSection">
        <div class="sec-title" id="secAnalysisLabel">—</div>
        <div class="analysis-box" id="detAnalysis"></div>
      </div>

      <div class="section">
        <div class="sec-title" id="secSourcesLabel">—</div>
        <ul class="sources-list" id="detSources"></ul>
      </div>

      <div class="det-footer">
        <button class="btn-copy-card" id="btnCopyCard">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
          <span id="copyCardLabel">Копировать карточку</span>
        </button>
      </div>
    </div>
  </main>
</div>

<div class="panel-overlay" id="sortPanel">
  <div class="panel-box" style="width:min(380px,96vw)">
    <div class="panel-head">
      <div class="panel-title" data-i18n="sortPanelTitle">↕ Сортировка списка</div>
      <button class="panel-close" id="sortClose">✕</button>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px" id="sortOptions">
      <button class="sort-opt active" data-sort="default">📋 По умолчанию (порядок в базе)</button>
      <button class="sort-opt" data-sort="name-az">А→Я По имени</button>
      <button class="sort-opt" data-sort="name-za">Я→А По имени</button>
      <button class="sort-opt" data-sort="score-desc">⬆ Самые надёжные первыми</button>
      <button class="sort-opt" data-sort="score-asc">⬇ Самые слабые первыми</button>
      <button class="sort-opt" data-sort="sources-desc">📚 Больше источников первыми</button>
    </div>
  </div>
</div>

<div id="readingProgress" style="width:0"></div>

<button id="btnScrollTop" aria-label="Наверх" data-i18n-aria="scrollTopLabel">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <polyline points="18 15 12 9 6 15"/>
  </svg>
</button>

<div class="toast-wrap" id="toastWrap"></div>

</body>
</html>
